# ValuePilot official Argentina release workflow.
#
# Cloud Scheduler invokes this workflow with the operator-owned bucket and
# immutable Cloud Build source object supplied as runtime arguments.  The
# national catalog is queried first; a stable metadata checksum returns
# NO_CHANGE without starting Cloud Build.  The heavy worker owns exact source
# validation, the distributed lease, private archive, and the existing
# deterministic release builder.  Promotion defaults to write-free SHADOW;
# explicit staging/activation inputs are passed through to the worker, which
# validates them before any canary or active pointer write.  This workflow
# never receives or stores raw ZIP bytes.
main:
  params: [args]
  steps:
    - init:
        assign:
          - project_id: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - control_bucket: ${args.controlBucket}
          - archive_bucket: ${args.archiveBucket}
          - source_bucket: ${args.sourceBucket}
          - source_object: ${args.sourceObject}
          - source_generation: ${args.sourceGeneration}
          - metadata_url: "https://datos.gob.ar/api/3/action/package_show?id=precios-claros-base-sepa"
          - state_object: "control/workflow-discovery-state.json"
          - execution_id: ${default(args.executionId, sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID"))}
          - current_release_date: ${default(args.currentReleaseDate, "")}
          - current_source_sha256: ${default(args.currentSourceSha256, "")}
          - upstream_changed: ${default(args.upstreamChanged, false)}
          - promotion_mode: ${default(args.promotionMode, "SHADOW")}

    - discover_catalog:
        try:
          call: http.get
          args:
            url: ${metadata_url}
            timeout: 20
            headers:
              Accept: "application/json"
              User-Agent: "ValuePilot-release-workflow/1"
          result: catalog_response
        retry: ${http.default_retry}
        except:
          as: discovery_error
          steps:
            - discovery_failed:
                return:
                  status: DISCOVERY_FAILED
                  error: ${discovery_error}
                  cloudBuildStarted: false

    - validate_catalog:
        switch:
          - condition: ${catalog_response.code != 200}
            return:
              status: DISCOVERY_FAILED
              httpStatus: ${catalog_response.code}
              cloudBuildStarted: false
          - condition: ${catalog_response.body.success != true}
            return:
              status: DISCOVERY_FAILED
              reason: CATALOG_RESPONSE_NOT_SUCCESS
              cloudBuildStarted: false
          - condition: ${catalog_response.body.result.id != "0f495d54-4a5d-5fa3-a323-f6e97ce434cf"}
            return:
              status: SOURCE_CONTRACT_CHANGED
              reason: DATASET_ID_CHANGED
              cloudBuildStarted: false
          - condition: ${catalog_response.body.result.name != "precios-claros-base-sepa"}
            return:
              status: SOURCE_CONTRACT_CHANGED
              reason: DATASET_NAME_CHANGED
              cloudBuildStarted: false
          - condition: ${catalog_response.body.result.title != "Precios Claros - Base SEPA"}
            return:
              status: SOURCE_CONTRACT_CHANGED
              reason: DATASET_TITLE_CHANGED
              cloudBuildStarted: false
          - condition: ${catalog_response.body.result.license_title != "Creative Commons Attribution 4.0"}
            return:
              status: SOURCE_CONTRACT_CHANGED
              reason: DATASET_LICENSE_CHANGED
              cloudBuildStarted: false

    - checksum_catalog:
        call: hash.compute_checksum
        args:
          data: ${json.encode(catalog_response.body)}
          algorithm: SHA256
        result: metadata_checksum

    - read_previous_state:
        try:
          steps:
            - get_state:
                call: googleapis.storage.v1.objects.get
                args:
                  bucket: ${control_bucket}
                  object: ${text.url_encode(state_object)}
                  alt: media
                result: previous_state_response
            - decode_state:
                assign:
                  - previous_state: ${json.decode(text.decode(previous_state_response.body))}
                  - previous_state_generation: ${previous_state_response.generation}
        except:
          as: state_error
          steps:
            - classify_state_error:
                switch:
                  # A first run has no state object.  Only that explicit
                  # not-found response may initialize an empty state.
                  - condition: ${state_error.code == 404}
                    assign:
                      - previous_state: {}
                      - previous_state_generation: null
                  # Any outage, permission failure, malformed state, or
                  # provider error is uncertainty and must stop before a
                  # Cloud Build can be started.
                  - condition: true
                    return:
                      status: CONTROL_STATE_UNAVAILABLE
                      cloudBuildStarted: false
                      activePointerWrites: 0

    - no_change:
        switch:
          - condition: ${previous_state.metadataChecksum == metadata_checksum}
            return:
              status: NO_CHANGE
              metadataChecksum: ${metadata_checksum}
              cloudBuildStarted: false
              activePointerWrites: 0

    - start_release_build:
        try:
          call: googleapis.cloudbuild.v1.projects.builds.create
          args:
            projectId: ${project_id}
            parent: ${"projects/" + project_id + "/locations/global"}
            body:
              source:
                storageSource:
                  bucket: ${source_bucket}
                  object: ${source_object}
                  generation: ${source_generation}
              steps:
                - name: ${args.workerImage}
                  entrypoint: python
                  args:
                    - "-m"
                    - tools.argentina_release_worker
                    - "--observed-at=${args.observedAt}"
                    - "--execution-id=${execution_id}"
                    - "--archive-bucket=${archive_bucket}"
                    - "--archive-project=${project_id}"
                    - "--workspace=/workspace/valuepilot-release-workspace"
                    - "--output=/workspace/valuepilot-release-output"
                    - "--current-release-date=${current_release_date}"
                    - "--current-source-sha256=${current_source_sha256}"
                    - "--promotion-mode=${promotion_mode}"
                    - "--promotion-data-canary=${default(args.promotionDataCanaryPath, "")}"
                    - "--promotion-expected-current-release-id=${default(args.expectedCurrentReleaseId, "")}"
                    - "--promotion-store-root=${default(args.promotionStoreRoot, "")}"
                    - "--promotion-us-bucket=${default(args.promotionUsBucket, "")}"
                    - "--promotion-sa-bucket=${default(args.promotionSaBucket, "")}"
                    - "--promotion-r2-bucket=${default(args.promotionR2Bucket, "")}"
                    - "--promotion-gcs-project=${default(args.promotionGcsProject, "")}"
                    - "--promotion-r2-endpoint=${default(args.promotionR2Endpoint, "")}"
                    - "--promotion-r2-region=${default(args.promotionR2Region, "")}"
                    - "--promotion-us-smoke-url=${default(args.promotionUsSmokeUrl, "")}"
                    - "--promotion-sa-smoke-url=${default(args.promotionSaSmokeUrl, "")}"
                    - "--promotion-r2-smoke-url=${default(args.promotionR2SmokeUrl, "")}"
                  env:
                    - "PYTHONUNBUFFERED=1"
                    - "BUILDER_IMAGE=${args.workerImage}"
                    - "BUILDER_SHA=${args.builderSha}"
                    - "VALUEPILOT_UPSTREAM_CHANGED=${string(upstream_changed)}"
                    - "VALUEPILOT_SOURCE_ARCHIVE_KEY=${default(args.sourceArchiveKey, \"\")}"
                    - "VALUEPILOT_SOURCE_ARCHIVE_SHA256=${default(args.sourceArchiveSha256, \"\")}"
              options:
                machineType: E2_STANDARD_2
                diskSizeGb: "200"
                logging: CLOUD_LOGGING_ONLY
                requestedVerifyOption: VERIFIED
              timeout: "14400s"
              serviceAccount: ${args.builderServiceAccount}
          # The connector waits for the long-running build operation and
          # returns its operation metadata, including the final Build record.
          connector_params:
            timeout: 14400
            polling_policy:
              initial_delay: 5
              multiplier: 1.5
              max_delay: 60
          result: release_build
        except:
          as: build_error
          steps:
            - build_start_failed:
                return:
                  status: BUILD_FAILED
                  error: ${build_error}
                  cloudBuildStarted: false
                  activePointerWrites: 0

    - validate_release_build:
        switch:
          - condition: ${release_build.metadata.build.status != "SUCCESS"}
            return:
              status: BUILD_FAILED
              buildId: ${release_build.metadata.build.id}
              buildStatus: ${release_build.metadata.build.status}
              cloudBuildStarted: true
              activePointerWrites: 0

    - read_worker_summary:
        try:
          call: googleapis.storage.v1.objects.get
          args:
            bucket: ${archive_bucket}
            object: ${text.url_encode("control/executions/" + execution_id + ".json")}
            alt: media
          result: worker_summary_response
        except:
          as: worker_summary_error
          steps:
            - worker_summary_failed:
                return:
                  status: WORKER_SUMMARY_UNAVAILABLE
                  buildId: ${release_build.metadata.build.id}
                  error: ${worker_summary_error}
                  cloudBuildStarted: true
                  activePointerWrites: null

    - decode_worker_summary:
        try:
          assign:
            - worker_summary: ${json.decode(text.decode(worker_summary_response.body))}
        except:
          as: worker_summary_decode_error
          steps:
            - worker_summary_invalid:
                return:
                  status: WORKER_SUMMARY_INVALID
                  buildId: ${release_build.metadata.build.id}
                  error: ${worker_summary_decode_error}
                  cloudBuildStarted: true
                  activePointerWrites: null

    - validate_worker_summary:
        switch:
          - condition: ${worker_summary.schemaVersion != "valuepilot-argentina-release-worker-v1" || worker_summary.policyVersion != "valuepilot-argentina-release-worker-policy-v1" || worker_summary.executionId != execution_id}
            return:
              status: WORKER_SUMMARY_INVALID
              buildId: ${release_build.metadata.build.id}
              reason: WORKER_SUMMARY_IDENTITY_MISMATCH
              cloudBuildStarted: true
              activePointerWrites: null

    - write_discovery_state:
        try:
          call: googleapis.storage.v1.objects.insert
          args:
            bucket: ${control_bucket}
            name: ${text.url_encode(state_object)}
            uploadType: media
            ifGenerationMatch: ${default(previous_state_generation, "0")}
            body: '${json.encode({"schemaVersion":"valuepilot-argentina-workflow-discovery-v1","metadataChecksum":metadata_checksum,"observedAt":args.observedAt,"datasetId":catalog_response.body.result.id,"buildId":release_build.metadata.build.id})}'
          result: state_write
        except:
          as: state_write_error
          steps:
            - state_write_failed:
                return:
                  status: STATE_WRITE_FAILED
                  buildId: ${release_build.metadata.build.id}
                  error: ${state_write_error}
                  cloudBuildStarted: true
                  activePointerWrites: ${default(worker_summary.activePointerWrites, null)}
                  promotion: ${default(worker_summary.promotion, null)}

    - return_build:
        return:
          status: ${default(worker_summary.status, "WORKER_STATUS_MISSING")}
          buildId: ${release_build.metadata.build.id}
          metadataChecksum: ${metadata_checksum}
          cloudBuildStarted: true
          activePointerWrites: ${default(worker_summary.activePointerWrites, null)}
          releaseId: ${default(worker_summary.releaseId, null)}
          promotion: ${default(worker_summary.promotion, null)}
          activation: ${default(worker_summary.activation, "NOT_EXECUTED")}
