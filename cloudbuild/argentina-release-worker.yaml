# ValuePilot official Argentina release worker.
#
# This file is an operator-supplied Cloud Build configuration.  The builder
# image substitution must point at an approved, digest-pinned image that
# contains the repository's pinned Python dependencies; no image or secret is
# fetched from this file.  The handoff entrypoint delegates the normal path to
# the mature release worker unchanged.  When a verified source-archive key and
# SHA are supplied, it first restores that exact ZIP and passes it to the
# worker as an explicit local source so stale CKAN metadata cannot suppress a
# real archived handoff.  Qualification, deterministic build, promotion, and
# pointer rules remain owned by the existing release worker.
# After a successful verified candidate build, the immutable candidate is also
# staged into the private archive bucket.  That post-build archive stage never
# writes ACTIVE or CANARY and prevents the expensive ephemeral workspace from
# disappearing when Cloud Build exits.
steps:
  - id: acquire-qualify-and-build
    name: '${_RELEASE_WORKER_IMAGE}'
    entrypoint: /bin/sh
    args:
      - '-c'
      - |
        ulimit -Sn 4096
        if [ "$?" -ne 0 ]; then
          exit 70
        fi
        python "$@"
        worker_rc=$?
        if [ "$worker_rc" -ne 0 ]; then
          exit "$worker_rc"
        fi
        python - <<'PY'
        import hashlib
        import json
        import os
        from pathlib import Path

        from backend.object_store import GCSObjectStore
        from tools.argentina_object_store_publisher import ObjectStoreReleasePublisher

        bucket = os.environ["VALUEPILOT_CANDIDATE_ARCHIVE_BUCKET"]
        project = os.environ["VALUEPILOT_CANDIDATE_ARCHIVE_PROJECT"]
        execution_id = os.environ["VALUEPILOT_EXECUTION_ID"]
        workspace = Path(os.environ["VALUEPILOT_CANDIDATE_WORKSPACE"]).resolve()
        store = GCSObjectStore(bucket=bucket, project=project)
        summary_key = f"control/executions/{execution_id}.json"
        summary = json.loads(store.get(summary_key))
        status = summary.get("status")
        if status not in {"CANDIDATE_VERIFIED", "CANARY_READY", "ACTIVE"}:
            print(json.dumps({"candidateArchive": "SKIPPED", "executionId": execution_id, "workerStatus": status}, sort_keys=True))
            raise SystemExit(0)
        release_id = summary.get("releaseId")
        if not isinstance(release_id, str) or not release_id:
            raise RuntimeError("verified candidate summary is missing releaseId")
        if not workspace.is_dir():
            raise RuntimeError("verified candidate workspace is unavailable")
        publisher = ObjectStoreReleasePublisher(store)
        staged = publisher.stage(workspace, release_ids=(release_id,), active_release_id=None)
        verified = publisher.verify(release_id)
        receipt = {
            "schemaVersion": "valuepilot-argentina-candidate-archive-v1",
            "executionId": execution_id,
            "releaseId": release_id,
            "status": "PERSISTED",
            "objectCount": verified.get("objectCount"),
            "objectBytes": verified.get("objectBytes"),
            "bytes": verified.get("bytes"),
            "newImmutableObjectCount": staged.get("newImmutableObjectCount"),
            "reusedImmutableObjectCount": staged.get("reusedImmutableObjectCount"),
            "activePointerWrites": 0,
        }
        payload = (json.dumps(receipt, ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n").encode("utf-8")
        receipt_key = f"candidate-archive/receipts/{execution_id}.json"
        store.put_immutable(receipt_key, payload, sha256=hashlib.sha256(payload).hexdigest())
        print(json.dumps({"candidateArchive": receipt, "receiptKey": receipt_key}, ensure_ascii=False, sort_keys=True))
        PY
      - valuepilot-release-worker
      - '-m'
      - tools.argentina_release_handoff_worker
      - '--observed-at=${_OBSERVED_AT}'
      - '--execution-id=${_EXECUTION_ID}'
      - '--archive-bucket=${_ARCHIVE_BUCKET}'
      - '--archive-project=${PROJECT_ID}'
      - '--workspace=/tmp/valuepilot-release-workspace'
      - '--output=/tmp/valuepilot-release-output'
      - '--current-release-date=${_CURRENT_RELEASE_DATE}'
      - '--current-source-sha256=${_CURRENT_SOURCE_SHA256}'
      - '--promotion-mode=${_PROMOTION_MODE}'
      - '--promotion-data-canary=${_PROMOTION_DATA_CANARY_PATH}'
      - '--promotion-expected-current-release-id=${_EXPECTED_CURRENT_RELEASE_ID}'
      - '--promotion-store-root=${_PROMOTION_STORE_ROOT}'
      - '--promotion-us-bucket=${_PROMOTION_US_BUCKET}'
      - '--promotion-sa-bucket=${_PROMOTION_SA_BUCKET}'
      - '--promotion-r2-bucket=${_PROMOTION_R2_BUCKET}'
      - '--promotion-gcs-project=${_PROMOTION_GCS_PROJECT}'
      - '--promotion-r2-endpoint=${_PROMOTION_R2_ENDPOINT}'
      - '--promotion-r2-region=${_PROMOTION_R2_REGION}'
      - '--promotion-us-smoke-url=${_PROMOTION_US_SMOKE_URL}'
      - '--promotion-sa-smoke-url=${_PROMOTION_SA_SMOKE_URL}'
      - '--promotion-r2-smoke-url=${_PROMOTION_R2_SMOKE_URL}'
    env:
      - 'PYTHONUNBUFFERED=1'
      - 'VALUEPILOT_SOURCE_ARCHIVE_KEY=${_SOURCE_ARCHIVE_KEY}'
      - 'VALUEPILOT_SOURCE_ARCHIVE_SHA256=${_SOURCE_ARCHIVE_SHA256}'
      - 'VALUEPILOT_UPSTREAM_CHANGED=${_UPSTREAM_CHANGED}'
      - 'VALUEPILOT_CANDIDATE_ARCHIVE_BUCKET=${_ARCHIVE_BUCKET}'
      - 'VALUEPILOT_CANDIDATE_ARCHIVE_PROJECT=${PROJECT_ID}'
      - 'VALUEPILOT_EXECUTION_ID=${_EXECUTION_ID}'
      - 'VALUEPILOT_CANDIDATE_WORKSPACE=/tmp/valuepilot-release-output/searchpack-workspace'
      - 'BUILDER_IMAGE=${_RELEASE_WORKER_IMAGE}'
      - 'BUILDER_SHA=${_BUILDER_SHA}'
    # The verified national SHADOW run took almost four hours; retain bounded
    # six-hour headroom without changing the qualified machine shape.
    timeout: 21600s

timeout: 21600s
options:
  # Cloud Build exposes e2-standard-2 as E2_STANDARD_2.  This is the smallest
  # qualified shape for the filesystem-heavy release worker.
  machineType: E2_STANDARD_2
  diskSizeGb: '200'
  logging: CLOUD_LOGGING_ONLY
  requestedVerifyOption: VERIFIED
substitutions:
  _RELEASE_WORKER_IMAGE: 'REPLACE_WITH_DIGEST_PINNED_VALUEPILOT_WORKER_IMAGE'
  _BUILDER_SHA: 'REPLACE_WITH_BUILDER_SOURCE_SHA'
  _ARCHIVE_BUCKET: 'REPLACE_WITH_OPERATOR_ONLY_ARCHIVE_BUCKET'
  _OBSERVED_AT: 'REQUIRED_RFC3339_TIMESTAMP'
  _EXECUTION_ID: 'cloud-build-execution'
  _CURRENT_RELEASE_DATE: ''
  _CURRENT_SOURCE_SHA256: ''
  _SOURCE_ARCHIVE_KEY: ''
  _SOURCE_ARCHIVE_SHA256: ''
  _UPSTREAM_CHANGED: 'false'
  # SHADOW is the only safe default.  Non-shadow modes require explicit
  # destinations/evidence; AUTO_ACTIVATE also requires all three HTTPS
  # production smoke endpoints.
  _PROMOTION_MODE: 'SHADOW'
  _PROMOTION_DATA_CANARY_PATH: ''
  _EXPECTED_CURRENT_RELEASE_ID: ''
  _PROMOTION_STORE_ROOT: ''
  _PROMOTION_US_BUCKET: ''
  _PROMOTION_SA_BUCKET: ''
  _PROMOTION_R2_BUCKET: ''
  _PROMOTION_GCS_PROJECT: ''
  _PROMOTION_R2_ENDPOINT: ''
  _PROMOTION_R2_REGION: ''
  _PROMOTION_US_SMOKE_URL: ''
  _PROMOTION_SA_SMOKE_URL: ''
  _PROMOTION_R2_SMOKE_URL: ''
serviceAccount: 'REPLACE_WITH_SCOPED_RELEASE_BUILDER_SERVICE_ACCOUNT'
