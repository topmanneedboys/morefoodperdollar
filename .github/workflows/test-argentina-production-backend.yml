name: Test Argentina production backend

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/**'
      - 'tools/argentina_national_routing.py'
      - 'tools/build_argentina_national_routing_artifact.py'
      - 'tools/tests/test_argentina_national_routing.py'
      - 'tools/argentina_sepa_query.py'
      - 'tools/measure_argentina_production_backend.py'
      - 'tools/consumer_input_intelligence.py'
      - 'tools/build_argentina_input_vocabulary.py'
      - 'tools/measure_argentina_consumer_input_intelligence.py'
      - 'tools/argentina_storage_retention.py'
      - 'tools/manage_argentina_storage_retention.py'
      - 'tools/tests/test_argentina_storage_retention.py'
      - 'tools/fixtures/argentina_storage_retention/**'
      - 'tools/data/argentina_input_aliases.json'
      - 'tools/tests/test_consumer_input_intelligence.py'
      - 'tools/argentina_searchpack.py'
      - 'tools/build_argentina_searchpack.py'
      - 'tools/measure_argentina_searchpack.py'
      - 'tools/tests/test_argentina_searchpack.py'
      - 'native/searchpack/**'
      - 'ARGENTINA_CONSUMER_INPUT_INTELLIGENCE_QUALIFICATION.*'
      - 'ARGENTINA_PRODUCTION_BACKEND_QUALIFICATION.*'
      - '.github/workflows/test-argentina-production-backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'tools/argentina_national_routing.py'
      - 'tools/build_argentina_national_routing_artifact.py'
      - 'tools/tests/test_argentina_national_routing.py'
      - 'tools/argentina_sepa_query.py'
      - 'tools/measure_argentina_production_backend.py'
      - 'tools/consumer_input_intelligence.py'
      - 'tools/build_argentina_input_vocabulary.py'
      - 'tools/measure_argentina_consumer_input_intelligence.py'
      - 'tools/argentina_storage_retention.py'
      - 'tools/manage_argentina_storage_retention.py'
      - 'tools/tests/test_argentina_storage_retention.py'
      - 'tools/fixtures/argentina_storage_retention/**'
      - 'tools/data/argentina_input_aliases.json'
      - 'tools/tests/test_consumer_input_intelligence.py'
      - 'tools/argentina_searchpack.py'
      - 'tools/build_argentina_searchpack.py'
      - 'tools/measure_argentina_searchpack.py'
      - 'tools/tests/test_argentina_searchpack.py'
      - 'native/searchpack/**'
      - 'ARGENTINA_CONSUMER_INPUT_INTELLIGENCE_QUALIFICATION.*'
      - 'ARGENTINA_PRODUCTION_BACKEND_QUALIFICATION.*'
      - '.github/workflows/test-argentina-production-backend.yml'

permissions:
  contents: read

jobs:
  test-and-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.1
          components: rustfmt, clippy

      - name: Build and test native SearchPack kernel
        run: |
          cargo fmt --manifest-path native/searchpack/Cargo.toml -- --check
          cargo clippy --manifest-path native/searchpack/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path native/searchpack/Cargo.toml
          python -m pip install --disable-pip-version-check 'maturin>=1.9,<2'
          maturin build --manifest-path native/searchpack/Cargo.toml --release --out native/searchpack/wheels
          python -m pip install --disable-pip-version-check native/searchpack/wheels/*.whl

      - name: Compile backend and bounded diagnostics
        run: |
          python -m py_compile backend/*.py tools/measure_argentina_production_backend.py tools/consumer_input_intelligence.py tools/argentina_searchpack.py tools/build_argentina_searchpack.py tools/measure_argentina_searchpack.py tools/build_argentina_input_vocabulary.py tools/measure_argentina_consumer_input_intelligence.py tools/argentina_storage_retention.py tools/manage_argentina_storage_retention.py
          python -m unittest discover -s backend/tests -p 'test_*.py' -v

      - name: Run existing offline Python regression
        run: python -m unittest discover -s tools/tests -p 'test_*.py'

      - name: Build container
        run: docker build --file backend/Dockerfile --tag valuepilot-backend:test .

      - name: Smoke test health boundary
        shell: bash
        run: |
          set -euo pipefail
          id="valuepilot-backend-smoke-${GITHUB_RUN_ID}"
          docker run --detach --rm --name "$id" --publish 18080:8080 valuepilot-backend:test
          trap 'docker stop "$id" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/tmp/health.json; then
              test "$(python -c 'import json,sys; print(json.load(open("/tmp/health.json"))["status"])')" = ok
              exit 0
            fi
            sleep 1
          done
          docker logs "$id"
          exit 1
