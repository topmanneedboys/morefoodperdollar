name: Acquire Argentina SEPA through Windscribe

on:
  workflow_dispatch:
    inputs:
      force_download:
        description: Force one fresh provider ZIP check even when today's metadata fingerprint is already recorded
        required: false
        default: false
        type: boolean
      verify_promotion_access:
        description: Verify automation access to both active regional services without downloading or promoting
        required: false
        default: false
        type: boolean
      reconcile_only:
        description: Recover and activate completed verified builds without downloading or starting a new build
        required: false
        default: false
        type: boolean
  schedule:
    # Buenos Aires is UTC-3 year-round. These are 13:30, 15:30 and 17:30 ART,
    # Every day, including weekends. Every phase re-discovers authoritative metadata
    # (DISCOVERY_PLUS_RECOVERY). 13:30 is the primary byte check, 15:30
    # downloads only for changed metadata, and 17:30 permits one bounded late
    # byte recheck after an unchanged-metadata primary result proved stale.
    # Scheduled runs remain inert until ARGENTINA_AUTOMATED_ACQUISITION_ENABLED=true.
    - cron: '30 16 * * *'
    - cron: '30 18 * * *'
    - cron: '30 20 * * *'
    # Late catch-up byte check (20:30 ART). GitHub drops or delays scheduled
    # events under load; this bounded attempt keeps a missed earlier phase from
    # starving the active release. The preflight is idempotent, so a day that
    # already archived, built or started a SHADOW build reuses that evidence.
    - cron: '30 23 * * *'
    # Builds can finish after the last source check or across midnight.
    # This inexpensive control-only run never downloads or builds the catalog.
    - cron: '15 * * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: valuepilot-argentina-official-acquisition
  cancel-in-progress: false

jobs:
  acquire-and-shadow:
    if: (github.event_name == 'workflow_dispatch' || vars.ARGENTINA_AUTOMATED_ACQUISITION_ENABLED == 'true') && github.event.schedule != '15 * * * *' && inputs.reconcile_only != true && inputs.verify_promotion_access != true
    runs-on: ubuntu-latest
    # The long deterministic release build now runs asynchronously in Google
    # Cloud. This runner only performs bounded discovery/acquisition/handoff.
    timeout-minutes: 120
    environment: argentina-production

    env:
      GCP_PROJECT_ID: ${{ vars.VALUEPILOT_GCP_PROJECT_ID }}
      ACTIVE_BUCKET: ${{ vars.VALUEPILOT_ARGENTINA_ACTIVE_BUCKET }}
      ARCHIVE_BUCKET: ${{ vars.VALUEPILOT_ARGENTINA_ARCHIVE_BUCKET }}
      CONTROL_BUCKET: ${{ vars.VALUEPILOT_ARGENTINA_CONTROL_BUCKET }}
      WIF_PROVIDER: ${{ vars.VALUEPILOT_GCP_WIF_PROVIDER }}
      RELEASE_SERVICE_ACCOUNT: ${{ vars.VALUEPILOT_GCP_RELEASE_SERVICE_ACCOUNT }}
      RELEASE_WORKFLOW_NAME: ${{ vars.VALUEPILOT_ARGENTINA_WORKFLOW_NAME }}
      RELEASE_WORKFLOW_LOCATION: ${{ vars.VALUEPILOT_ARGENTINA_WORKFLOW_LOCATION }}
      BUILD_SOURCE_BUCKET: ${{ vars.VALUEPILOT_CLOUDBUILD_SOURCE_BUCKET }}
      BUILD_SOURCE_OBJECT: ${{ vars.VALUEPILOT_CLOUDBUILD_SOURCE_OBJECT }}
      BUILD_SOURCE_GENERATION: ${{ vars.VALUEPILOT_CLOUDBUILD_SOURCE_GENERATION }}
      WORKER_IMAGE: ${{ vars.VALUEPILOT_ARGENTINA_WORKER_IMAGE }}
      BUILDER_SHA: ${{ vars.VALUEPILOT_ARGENTINA_BUILDER_SHA }}
      BUILDER_SERVICE_ACCOUNT: ${{ vars.VALUEPILOT_ARGENTINA_BUILDER_SERVICE_ACCOUNT }}

    steps:
      - name: Checkout exact repository revision
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Initialize bounded runner paths
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "LOCAL_ARCHIVE=${RUNNER_TEMP}/valuepilot-argentina-source-archive"
            echo "HANDOFF_REPORT=${RUNNER_TEMP}/valuepilot-argentina-handoff.json"
            echo "PUBLISH_REPORT=${RUNNER_TEMP}/valuepilot-argentina-publish.json"
            echo "PREFLIGHT_REPORT=${RUNNER_TEMP}/valuepilot-argentina-preflight.json"
            echo "RESOLUTION_REPORT=${RUNNER_TEMP}/valuepilot-argentina-resolution.json"
            echo "ATTEMPT_REPORT=${RUNNER_TEMP}/valuepilot-argentina-attempt.json"
            echo "WORKFLOW_LAUNCH_REPORT=${RUNNER_TEMP}/valuepilot-argentina-workflow-launch.json"
            echo "SHADOW_STATE_REPORT=${RUNNER_TEMP}/valuepilot-argentina-shadow-state.json"
            echo "CURRENT_IDENTITY=${RUNNER_TEMP}/valuepilot-argentina-current.json"
            echo "WG_CONFIG=${RUNNER_TEMP}/vpwg.conf"
          } >> "${GITHUB_ENV}"

      - name: Validate deployment configuration
        shell: bash
        env:
          WINDSCRIBE_WIREGUARD_CONFIG_B64: ${{ secrets.WINDSCRIBE_WIREGUARD_CONFIG_B64 }}
        run: |
          set -euo pipefail
          required=(
            GCP_PROJECT_ID ACTIVE_BUCKET ARCHIVE_BUCKET CONTROL_BUCKET WIF_PROVIDER
            RELEASE_SERVICE_ACCOUNT RELEASE_WORKFLOW_NAME RELEASE_WORKFLOW_LOCATION
            BUILD_SOURCE_BUCKET BUILD_SOURCE_OBJECT BUILD_SOURCE_GENERATION WORKER_IMAGE
            BUILDER_SHA BUILDER_SERVICE_ACCOUNT
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required Argentina production variable ${name} is not configured."
              exit 2
            fi
          done
          if [[ -z "${WINDSCRIBE_WIREGUARD_CONFIG_B64:-}" ]]; then
            echo "::error::WINDSCRIBE_WIREGUARD_CONFIG_B64 is not configured."
            exit 2
          fi
          if [[ ! "${BUILD_SOURCE_GENERATION}" =~ ^[0-9]+$ ]]; then
            echo "::error::BUILD_SOURCE_GENERATION must pin one immutable GCS object generation."
            exit 2
          fi
          if [[ ! "${BUILDER_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::BUILDER_SHA must be an exact 40-character Git commit SHA."
            exit 2
          fi

      - name: Install bounded acquisition dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt

      - id: gcp-auth-read
        name: Authenticate current-state and private-archive lookup with GitHub OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.RELEASE_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Set up Google Cloud CLI for bounded workflow launch
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          version: '>= 520.0.0'

      - id: current
        name: Read checksum-verified current source identity
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.read_argentina_active_source_identity \
            --active-bucket "${ACTIVE_BUCKET}" \
            --active-project "${GCP_PROJECT_ID}" \
            --output "${CURRENT_IDENTITY}"
          release_date="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["releaseDate"])' "${CURRENT_IDENTITY}")"
          source_sha="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["sourceSha256"])' "${CURRENT_IDENTITY}")"
          active_release="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["activeReleaseId"])' "${CURRENT_IDENTITY}")"
          echo "release_date=${release_date}" >> "${GITHUB_OUTPUT}"
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"
          echo "active_release=${active_release}" >> "${GITHUB_OUTPUT}"
          echo "Current trusted source: ${release_date} (${source_sha:0:12}...)"

      - id: preflight
        name: Deduplicate today's acquisition before opening Argentina egress
        shell: bash
        env:
          FORCE_DOWNLOAD: ${{ inputs.force_download || false }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule || '' }}
          CURRENT_RELEASE_ID: ${{ steps.current.outputs.active_release }}
          CURRENT_RELEASE_DATE: ${{ steps.current.outputs.release_date }}
          CURRENT_SOURCE_SHA256: ${{ steps.current.outputs.source_sha }}
        run: |
          set -euo pipefail
          observed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          check_phase="PRIMARY"
          if [[ "${EVENT_NAME}" == "schedule" ]]; then
            case "${SCHEDULE_CRON}" in
              '30 16 * * *') check_phase="PRIMARY" ;;
              '30 18 * * *') check_phase="METADATA_ONLY" ;;
              '30 20 * * *') check_phase="LATE_RECHECK" ;;
              '30 23 * * *') check_phase="PRIMARY" ;;
              *) echo "::error::Unexpected Argentina acquisition schedule ${SCHEDULE_CRON}."; exit 2 ;;
            esac
          fi
          args=(
            preflight
            --observed-at "${observed_at}"
            --check-phase "${check_phase}"
            --current-release-id "${CURRENT_RELEASE_ID}"
            --current-release-date "${CURRENT_RELEASE_DATE}"
            --current-source-sha256 "${CURRENT_SOURCE_SHA256}"
            --archive-bucket "${ARCHIVE_BUCKET}"
            --archive-project "${GCP_PROJECT_ID}"
            --output "${PREFLIGHT_REPORT}"
          )
          if [[ "${FORCE_DOWNLOAD}" == "true" ]]; then
            args+=(--force-download)
          fi
          python -m tools.argentina_acquisition_schedule_control_v2 "${args[@]}"
          status="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["status"])' "${PREFLIGHT_REPORT}")"
          argentina_date="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["argentinaDate"])' "${PREFLIGHT_REPORT}")"
          fingerprint="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("metadataFingerprint","NOT_AVAILABLE"))' "${PREFLIGHT_REPORT}")"
          freshness="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("freshness",{}).get("state","NOT_EVALUATED"))' "${PREFLIGHT_REPORT}")"
          prior_status="$(python -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); s=d.get("sameDayState") or d.get("sameDayStateBeforeDiscovery") or d.get("priorSameDayState") or {}; print(s.get("status","NONE") if isinstance(s,dict) else "NONE")' "${PREFLIGHT_REPORT}")"
          active_unchanged="$(python -c 'import json,sys; print(str(json.load(open(sys.argv[1], encoding="utf-8")).get("activeReleaseUnchanged",True)).lower())' "${PREFLIGHT_REPORT}")"
          upstream_changed="$(python -c 'import json,sys; print(str(json.load(open(sys.argv[1], encoding="utf-8")).get("upstreamChanged",False)).lower())' "${PREFLIGHT_REPORT}")"
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          echo "observed_at=${observed_at}" >> "${GITHUB_OUTPUT}"
          echo "argentina_date=${argentina_date}" >> "${GITHUB_OUTPUT}"
          echo "metadata_fingerprint=${fingerprint}" >> "${GITHUB_OUTPUT}"
          echo "check_phase=${check_phase}" >> "${GITHUB_OUTPUT}"
          echo "freshness=${freshness}" >> "${GITHUB_OUTPUT}"
          echo "prior_day_status=${prior_status}" >> "${GITHUB_OUTPUT}"
          echo "active_release_unchanged=${active_unchanged}" >> "${GITHUB_OUTPUT}"
          echo "upstream_changed=${upstream_changed}" >> "${GITHUB_OUTPUT}"
          echo "Acquisition preflight: ${status} / ${check_phase} for ${argentina_date}; active freshness=${freshness}; prior same-day state=${prior_status}"

      - name: Explain temporary official metadata unavailability
        if: steps.preflight.outputs.status == 'UPSTREAM_TEMPORARILY_UNAVAILABLE' || steps.preflight.outputs.status == 'FRESHNESS_LIMIT_EXCEEDED' || steps.preflight.outputs.status == 'ACTIVE_RELEASE_UNVERIFIED'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os

          with open(os.environ["PREFLIGHT_REPORT"], encoding="utf-8") as handle:
              report = json.load(handle)
          upstream = report.get("upstreamFailure") or {}
          active = report.get("activeRelease") or {}
          freshness = report.get("freshness") or {}
          same_day = report.get("sameDayState") or {}
          unsafe_freshness = report.get("status") in {"FRESHNESS_LIMIT_EXCEEDED", "ACTIVE_RELEASE_UNVERIFIED"}
          heading = "### Argentina acquisition blocked: active freshness is unsafe" if unsafe_freshness else "### Official metadata temporarily unavailable"
          lines = [
              heading,
              "",
              f"- State: {report.get('status')}",
              f"- Upstream failure: {upstream.get('code')} / HTTP {upstream.get('httpStatus')} after {upstream.get('attempts')} bounded attempts",
              f"- Active release unchanged: {report.get('activeReleaseUnchanged')}",
              f"- Active release identity: {report.get('activeReleaseId') or 'UNVERIFIED'} / {active.get('releaseDate') or 'UNKNOWN'} / {active.get('sourceSha256') or 'UNKNOWN'}",
              f"- Freshness policy: {freshness.get('state')} ({freshness.get('ageDays')} of {freshness.get('maxAgeDays')} days; evaluated {freshness.get('evaluationDate')})",
              f"- Same-day state/candidate: {same_day.get('status')} / {same_day.get('candidateReleaseId')}",
              f"- Same-day reservation/SHADOW: {same_day.get('buildReservationId')} / {((same_day.get('shadowResult') or {}).get('status') if isinstance(same_day.get('shadowResult'), dict) else 'UNKNOWN')}",
              f"- Active/canary pointer writes: {report.get('activePointerWrites')} / {report.get('canaryPointerWrites')}",
              f"- Source substitutions: {report.get('sourceSubstitution')}; candidate promotion: {report.get('candidatePromotion')}",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          if unsafe_freshness:
              print(f"::error::Official metadata is unavailable and active-release freshness cannot safely cover it ({report.get('status')}; {freshness.get('state')}).")
          elif freshness.get("state") == "NEARING_LIMIT":
              print("::warning::Official metadata is unavailable and the trusted active release is nearing its explicit freshness limit.")
          print(" | ".join(lines[2:]))
          PY

      - name: Reuse today's immutable acquisition evidence without VPN
        if: steps.preflight.outputs.status != 'DOWNLOAD_REQUIRED'
        shell: bash
        run: |
          set -euo pipefail
          cp "${PREFLIGHT_REPORT}" "${RESOLUTION_REPORT}"
          echo "Reused today's verified acquisition evidence; provider ZIP was not downloaded."

      - name: Retire Google credential material before VPN phase
        if: steps.preflight.outputs.status == 'DOWNLOAD_REQUIRED'
        shell: bash
        run: |
          set -euo pipefail
          credential_path="${GOOGLE_GHA_CREDS_PATH:-${GOOGLE_APPLICATION_CREDENTIALS:-}}"
          if [[ -n "${credential_path}" && -f "${credential_path}" ]]; then
            shred -u "${credential_path}" >/dev/null 2>&1 || rm -f "${credential_path}"
          fi
          rm -f gha-creds-*.json
          {
            echo 'GOOGLE_APPLICATION_CREDENTIALS='
            echo 'CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE='
            echo 'GOOGLE_GHA_CREDS_PATH='
          } >> "${GITHUB_ENV}"

      - id: direct
        name: Try direct acquisition without the tunnel
        if: steps.preflight.outputs.status == 'DOWNLOAD_REQUIRED'
        continue-on-error: true
        shell: bash
        env:
          CURRENT_RELEASE_DATE: ${{ steps.current.outputs.release_date }}
          CURRENT_SOURCE_SHA256: ${{ steps.current.outputs.source_sha }}
          OBSERVED_AT: ${{ steps.preflight.outputs.observed_at }}
          UPSTREAM_CHANGED: ${{ steps.preflight.outputs.upstream_changed }}
        run: |
          set -uo pipefail
          handoff_args=(
            --observed-at "${OBSERVED_AT}"
            --current-release-date "${CURRENT_RELEASE_DATE}"
            --current-source-sha256 "${CURRENT_SOURCE_SHA256}"
            --archive-store "${LOCAL_ARCHIVE}"
            --upstream-change-evidence "${PREFLIGHT_REPORT}"
            --expected-discovery-response-sha256 "$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("catalogResponseSha256",""))' "${PREFLIGHT_REPORT}")"
            --output "${HANDOFF_REPORT}"
          )
          if [[ "${UPSTREAM_CHANGED}" == "true" ]]; then
            handoff_args+=(--upstream-changed)
          fi
          python -m tools.argentina_release_acquisition_handoff "${handoff_args[@]}"
          rc=$?
          if [[ ! -s "${HANDOFF_REPORT}" ]]; then
            echo "direct acquisition produced no handoff report (rc=${rc}); the tunnel fallback will run"
            exit 1
          fi
          status="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["status"])' "${HANDOFF_REPORT}")"
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          echo "Direct acquisition disposition: ${status} (rc=${rc})"
          if [[ "${rc}" != "0" ]]; then
            echo "direct acquisition failed closed with status ${status}; the tunnel fallback will run"
            exit 1
          fi
          case "${status}" in
            HANDOFF_READY|NO_CHANGE|OLDER_REJECTED) ;;
            *) echo "unexpected direct disposition ${status}"; exit 1 ;;
          esac

      - id: acquire
        name: Acquire and verify official SEPA through Windscribe Buenos Aires
        if: steps.preflight.outputs.status == 'DOWNLOAD_REQUIRED' && steps.direct.outcome != 'success'
        shell: bash
        env:
          WINDSCRIBE_WIREGUARD_CONFIG_B64: ${{ secrets.WINDSCRIBE_WIREGUARD_CONFIG_B64 }}
          CURRENT_RELEASE_DATE: ${{ steps.current.outputs.release_date }}
          CURRENT_SOURCE_SHA256: ${{ steps.current.outputs.source_sha }}
          OBSERVED_AT: ${{ steps.preflight.outputs.observed_at }}
          UPSTREAM_CHANGED: ${{ steps.preflight.outputs.upstream_changed }}
        run: |
          set -euo pipefail
          umask 077
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq wireguard-tools resolvconf >/dev/null

          printf '%s' "${WINDSCRIBE_WIREGUARD_CONFIG_B64}" | base64 --decode > "${WG_CONFIG}"
          chmod 600 "${WG_CONFIG}"
          if ! grep -Eq '^[[:space:]]*\[Interface\][[:space:]]*$' "${WG_CONFIG}" || \
             ! grep -Eq '^[[:space:]]*PrivateKey[[:space:]]*=[[:space:]]*[^[:space:]]+' "${WG_CONFIG}" || \
             ! grep -Eq '^[[:space:]]*\[Peer\][[:space:]]*$' "${WG_CONFIG}" || \
             ! grep -Eq '^[[:space:]]*Endpoint[[:space:]]*=[[:space:]]*[^[:space:]]+:[0-9]+[[:space:]]*$' "${WG_CONFIG}" || \
             ! grep -Eq '^[[:space:]]*AllowedIPs[[:space:]]*=.*0\.0\.0\.0/0([[:space:],]|$)' "${WG_CONFIG}"; then
            echo "::error::Windscribe config is missing the required IPv4 full-tunnel WireGuard contract."
            exit 2
          fi

          has_v6_address=0
          has_v6_default=0
          if grep -Eq '^[[:space:]]*Address[[:space:]]*=.*:' "${WG_CONFIG}"; then
            has_v6_address=1
          fi
          if grep -Eq '^[[:space:]]*AllowedIPs[[:space:]]*=.*::/0([[:space:],]|$)' "${WG_CONFIG}"; then
            has_v6_default=1
          fi
          if [[ "${has_v6_address}" != "${has_v6_default}" ]]; then
            echo "::error::Windscribe IPv6 tunnel contract is incomplete; refusing any IPv6 bypass possibility."
            exit 2
          fi
          if [[ "${has_v6_address}" == "0" ]]; then
            sudo sysctl -q -w net.ipv6.conf.all.disable_ipv6=1
            sudo sysctl -q -w net.ipv6.conf.default.disable_ipv6=1
          fi

          tunnel_up=0
          dns_backup="${RUNNER_TEMP}/valuepilot-resolv-before-tunnel.conf"
          sudo cp /etc/resolv.conf "${dns_backup}"
          cleanup_tunnel() {
            set +e
            if [[ "${tunnel_up}" == "1" ]]; then
              sudo wg-quick down "${WG_CONFIG}" >/dev/null 2>&1 || true
            fi
            if [[ -f "${dns_backup}" ]]; then
              sudo cp "${dns_backup}" /etc/resolv.conf
              sudo rm -f "${dns_backup}"
            fi
            shred -u "${WG_CONFIG}" >/dev/null 2>&1 || rm -f "${WG_CONFIG}"
          }
          trap cleanup_tunnel EXIT INT TERM

          sudo wg-quick up "${WG_CONFIG}" >/dev/null
          tunnel_up=1

          interface="$(basename "${WG_CONFIG}" .conf)"
          # Hosted-runner stub/provider DNS can become unreachable after the
          # full-tunnel switch. Public DNS must itself route through WireGuard;
          # a missing route stops acquisition, never falls back outside it.
          if ! ip -4 route get 1.1.1.1 | grep -Eq "dev ${interface}([[:space:]]|$)"; then
            echo "::error::DNS resolver is not routed through the authorized tunnel."
            exit 2
          fi
          printf 'nameserver 1.1.1.1\nnameserver 1.0.0.1\noptions timeout:2 attempts:3\n' | sudo tee /etc/resolv.conf >/dev/null
          set +e
          probe_code="$(curl --silent --show-error --max-time 30 --head \
            --retry 3 --retry-all-errors --retry-delay 3 --retry-max-time 120 \
            -o /dev/null --write-out '%{http_code}' 'https://datos.produccion.gob.ar/' || echo 000)"
          echo "download-host probe inside the tunnel: HTTP ${probe_code}"
          case "${probe_code}" in
            2*|3*) probe_exit=0 ;;
            *) probe_exit=1 ;;
          esac
          set -e
          handshake="$(sudo wg show "${interface}" latest-handshakes | awk 'NR==1 {print $2}')"
          now="$(date +%s)"
          if [[ -z "${handshake}" || "${handshake}" == "0" || $((now - handshake)) -gt 180 ]]; then
            echo "::error::Windscribe WireGuard tunnel has no recent handshake; refusing direct-route fallback."
            exit 2
          fi
          if [[ "${probe_exit}" != "0" ]]; then
            echo "::error::The tunnel handshook, but official metadata remains unreachable (curl exit ${probe_exit})."
            exit "${probe_exit}"
          fi

          set +e
          handoff_args=(
            --observed-at "${OBSERVED_AT}"
            --current-release-date "${CURRENT_RELEASE_DATE}"
            --current-source-sha256 "${CURRENT_SOURCE_SHA256}"
            --archive-store "${LOCAL_ARCHIVE}"
            --upstream-change-evidence "${PREFLIGHT_REPORT}"
            --expected-discovery-response-sha256 "$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("catalogResponseSha256",""))' "${PREFLIGHT_REPORT}")"
            --output "${HANDOFF_REPORT}"
          )
          if [[ "${UPSTREAM_CHANGED}" == "true" ]]; then
            handoff_args+=(--upstream-changed)
          fi
          python -m tools.argentina_release_acquisition_handoff "${handoff_args[@]}"
          rc=$?
          set -e

          cleanup_tunnel
          tunnel_up=0
          trap - EXIT INT TERM

          if [[ ! -s "${HANDOFF_REPORT}" ]]; then
            echo "::error::Acquisition did not produce a bounded handoff report."
            exit 2
          fi
          status="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["status"])' "${HANDOFF_REPORT}")"
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          if [[ "${rc}" != "0" ]]; then
            echo "::error::Official Argentina acquisition failed closed with status ${status}."
            cat "${HANDOFF_REPORT}"
            exit "${rc}"
          fi
          case "${status}" in
            HANDOFF_READY|NO_CHANGE|OLDER_REJECTED) ;;
            *) echo "::error::Unexpected acquisition disposition ${status}."; exit 2 ;;
          esac
          echo "Argentina acquisition disposition: ${status}"

      - id: gcp-auth-publish
        name: Re-authenticate to Google Cloud after VPN teardown
        if: steps.preflight.outputs.status == 'DOWNLOAD_REQUIRED'
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.RELEASE_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - id: publish
        name: Publish exact verified source to private GCS archive
        if: steps.direct.outputs.status == 'HANDOFF_READY' || steps.acquire.outputs.status == 'HANDOFF_READY'
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.publish_argentina_source_handoff \
            --handoff-report "${HANDOFF_REPORT}" \
            --local-archive-store "${LOCAL_ARCHIVE}" \
            --archive-bucket "${ARCHIVE_BUCKET}" \
            --archive-project "${GCP_PROJECT_ID}" \
            --output "${PUBLISH_REPORT}"
          archive_key="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["sourceArchiveKey"])' "${PUBLISH_REPORT}")"
          archive_sha="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["sourceArchiveSha256"])' "${PUBLISH_REPORT}")"
          echo "archive_key=${archive_key}" >> "${GITHUB_OUTPUT}"
          echo "archive_sha=${archive_sha}" >> "${GITHUB_OUTPUT}"

      - id: finalize
        name: Record immutable daily acquisition evidence after VPN teardown
        if: steps.preflight.outputs.status == 'DOWNLOAD_REQUIRED'
        shell: bash
        run: |
          set -euo pipefail
          args=(
            finalize
            --preflight "${PREFLIGHT_REPORT}"
            --handoff "${HANDOFF_REPORT}"
            --archive-bucket "${ARCHIVE_BUCKET}"
            --archive-project "${GCP_PROJECT_ID}"
            --output "${RESOLUTION_REPORT}"
          )
          if [[ "${{ steps.direct.outputs.status }}" == "HANDOFF_READY" || "${{ steps.acquire.outputs.status }}" == "HANDOFF_READY" ]]; then
            args+=(--publish "${PUBLISH_REPORT}")
          fi
          python -m tools.argentina_acquisition_schedule_control_v2 "${args[@]}"
          status="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["status"])' "${RESOLUTION_REPORT}")"
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          echo "Daily acquisition resolution: ${status}"

      - id: resolution
        name: Read bounded source resolution
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s "${RESOLUTION_REPORT}" ]]; then
            echo "::error::Source resolution report is missing."
            exit 2
          fi
          status="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["status"])' "${RESOLUTION_REPORT}")"
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          case "${status}" in
            SOURCE_READY|CANDIDATE_PERSISTED|NO_BUILD_REQUIRED|UPSTREAM_TEMPORARILY_UNAVAILABLE) ;;
            FRESHNESS_LIMIT_EXCEEDED|ACTIVE_RELEASE_UNVERIFIED)
              echo "::error::Official metadata is unavailable and active release freshness cannot safely cover it (${status})."
              exit 2
              ;;
            *) echo "::error::Unexpected source resolution ${status}."; exit 2 ;;
          esac
          echo "Resolved acquisition state: ${status}"

      - name: Stop cleanly when no build is required
        if: steps.resolution.outputs.status == 'CANDIDATE_PERSISTED' || steps.resolution.outputs.status == 'NO_BUILD_REQUIRED' || steps.resolution.outputs.status == 'UPSTREAM_TEMPORARILY_UNAVAILABLE'
        shell: bash
        run: |
          set -euo pipefail
          echo "Resolution: ${{ steps.resolution.outputs.status }}"
          if [[ "${{ steps.resolution.outputs.status }}" == "UPSTREAM_TEMPORARILY_UNAVAILABLE" ]]; then
            echo "Official metadata is temporarily unavailable; the active release is unchanged and its freshness was evaluated explicitly."
          else
            echo "No provider re-download, duplicate build, canary, or active pointer change is required."
          fi

      - id: reserve
        name: Reserve at most one heavy build attempt per candidate per Argentina day
        if: steps.resolution.outputs.status == 'SOURCE_READY'
        shell: bash
        run: |
          set -euo pipefail
          reservation_id="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python -m tools.argentina_acquisition_schedule_control_v2 reserve \
            --resolution "${RESOLUTION_REPORT}" \
            --reservation-id "${reservation_id}" \
            --archive-bucket "${ARCHIVE_BUCKET}" \
            --archive-project "${GCP_PROJECT_ID}" \
            --output "${ATTEMPT_REPORT}"
          status="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["status"])' "${ATTEMPT_REPORT}")"
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          echo "reservation_id=${reservation_id}" >> "${GITHUB_OUTPUT}"
          echo "Build reservation: ${status}"

      - id: recover
        name: Recover a reservation whose launch never happened
        if: steps.reserve.outputs.status == 'ALREADY_RESERVED'
        shell: bash
        run: |
          set -uo pipefail
          pending=""
          for bucket in "${ARCHIVE_BUCKET}" "${CONTROL_BUCKET}"; do
            if gcloud storage cat "gs://${bucket}/control/pending-workflow.json" >/dev/null 2>&1; then
              pending="gs://${bucket}/control/pending-workflow.json"
              break
            fi
          done
          if [ -n "${pending}" ]; then
            echo "Build gate: ALREADY_RESERVED with a live pending workflow (${pending}); not launching."
            echo "recover=false" >> "${GITHUB_OUTPUT}"
          else
            echo "Build gate: ALREADY_RESERVED but no pending workflow exists - the previous launch never"
            echo "started, so this reservation is dead. Launching the build for this candidate."
            echo "recover=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Stop cleanly when the candidate is already persisted
        if: steps.reserve.outputs.status == 'CANDIDATE_PERSISTED'
        shell: bash
        run: |
          set -euo pipefail
          echo "Build gate: ${{ steps.reserve.outputs.status }}"
          echo "The candidate release already exists, so no build is started."

      - id: launch
        name: Start one asynchronous Google SHADOW release workflow
        if: steps.reserve.outputs.status == 'RESERVED' || steps.recover.outputs.recover == 'true'
        shell: bash
        env:
          CURRENT_RELEASE_DATE: ${{ steps.current.outputs.release_date }}
          CURRENT_SOURCE_SHA256: ${{ steps.current.outputs.source_sha }}
          OBSERVED_AT: ${{ steps.preflight.outputs.observed_at }}
          EXECUTION_ID: ${{ steps.reserve.outputs.reservation_id }}
          UPSTREAM_CHANGED: ${{ steps.preflight.outputs.upstream_changed }}
        run: |
          set -euo pipefail
          reserved_id="$(python -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); print(d.get("existingReservationId") or "")' "${ATTEMPT_REPORT}")"
          if [ -n "${reserved_id}" ]; then
            export EXECUTION_ID="${reserved_id}"
            echo "Adopting the day's existing reservation id: ${EXECUTION_ID}"
          fi
          export SOURCE_ARCHIVE_KEY="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["sourceArchiveKey"])' "${ATTEMPT_REPORT}")"
          export SOURCE_ARCHIVE_SHA256="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["sourceArchiveSha256"])' "${ATTEMPT_REPORT}")"
          data="$(python - <<'PY'
          import json, os
          with open(os.environ["PREFLIGHT_REPORT"], encoding="utf-8") as handle:
              preflight = json.load(handle)
          value = {
              "controlBucket": os.environ["CONTROL_BUCKET"],
              "archiveBucket": os.environ["ARCHIVE_BUCKET"],
              "sourceBucket": os.environ["BUILD_SOURCE_BUCKET"],
              "sourceObject": os.environ["BUILD_SOURCE_OBJECT"],
              "sourceGeneration": os.environ["BUILD_SOURCE_GENERATION"],
              "workerImage": os.environ["WORKER_IMAGE"],
              "builderSha": os.environ["BUILDER_SHA"],
              "builderServiceAccount": os.environ["BUILDER_SERVICE_ACCOUNT"],
              "observedAt": os.environ["OBSERVED_AT"],
              "executionId": os.environ["EXECUTION_ID"],
              "currentReleaseDate": os.environ["CURRENT_RELEASE_DATE"],
              "currentSourceSha256": os.environ["CURRENT_SOURCE_SHA256"],
              "sourceArchiveKey": os.environ["SOURCE_ARCHIVE_KEY"],
              "sourceArchiveSha256": os.environ["SOURCE_ARCHIVE_SHA256"],
              "upstreamChanged": os.environ.get("UPSTREAM_CHANGED", "false").lower() == "true",
              "upstreamChangeEvidence": preflight.get("upstreamChangeEvidence"),
              "promotionMode": "SHADOW",
          }
          if value["promotionMode"] != "SHADOW":
              raise SystemExit("automatic acquisition must remain SHADOW")
          print(json.dumps(value, separators=(",", ":")))
          PY
          )"
          gcloud workflows execute "${RELEASE_WORKFLOW_NAME}" \
            --project "${GCP_PROJECT_ID}" \
            --location "${RELEASE_WORKFLOW_LOCATION}" \
            --call-log-level=log-errors-only \
            --data "${data}" \
            --format=json > "${WORKFLOW_LAUNCH_REPORT}"
          workflow_execution="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["name"])' "${WORKFLOW_LAUNCH_REPORT}")"
          workflow_state="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("state", ""))' "${WORKFLOW_LAUNCH_REPORT}")"
          if [[ -z "${workflow_execution}" ]]; then
            echo "::error::Google Workflow did not return an execution resource name."
            exit 2
          fi
          echo "workflow_execution=${workflow_execution}" >> "${GITHUB_OUTPUT}"
          echo "Google SHADOW workflow started asynchronously: ${workflow_execution} (${workflow_state})"
          echo "The GitHub runner will not wait for the multi-hour Cloud Build."

          recorded_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python -m tools.argentina_acquisition_schedule_control_v2 record-shadow-state \
            --resolution "${RESOLUTION_REPORT}" \
            --status SHADOW_STARTED \
            --workflow-execution "${workflow_execution}" \
            --reservation-id "${EXECUTION_ID}" \
            --recorded-at "${recorded_at}" \
            --archive-bucket "${ARCHIVE_BUCKET}" \
            --archive-project "${GCP_PROJECT_ID}" \
            --output "${SHADOW_STATE_REPORT}"

      - name: Summarize bounded automatic acquisition decision
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Argentina acquisition control"
            echo "- Argentina date: ${{ steps.preflight.outputs.argentina_date }}"
            echo "- Check phase: ${{ steps.preflight.outputs.check_phase }}"
            echo "- Preflight: ${{ steps.preflight.outputs.status }}"
            echo "- Resolution: ${{ steps.resolution.outputs.status }}"
            echo "- Build reservation: ${{ steps.reserve.outputs.status || 'NOT_REQUIRED' }}"
            echo "- Prior same-day persisted state: ${{ steps.preflight.outputs.prior_day_status || 'NOT_READ' }}"
            echo "- Active release unchanged: ${{ steps.preflight.outputs.active_release_unchanged || 'true' }}"
            echo "- Active freshness: ${{ steps.preflight.outputs.freshness || 'NOT_EVALUATED' }}"
            echo "- Promotion mode: SHADOW"
            echo "- Active/canary pointer writes by this GitHub workflow: 0"
            echo "- Source substitution during metadata outage: 0"
            echo "- Late-check policy: DISCOVERY_PLUS_RECOVERY"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove runner-local credential and raw-source material
        if: always()
        shell: bash
        run: |
          set +e
          credential_path="${GOOGLE_GHA_CREDS_PATH:-${GOOGLE_APPLICATION_CREDENTIALS:-}}"
          if [[ -n "${credential_path}" && -f "${credential_path}" ]]; then
            shred -u "${credential_path}" >/dev/null 2>&1 || rm -f "${credential_path}"
          fi
          rm -f gha-creds-*.json "${WG_CONFIG}" "${RUNNER_TEMP}/valuepilot-catalog-probe.json"
          rm -rf "${LOCAL_ARCHIVE}"

  reconcile-shadow:
    # This job is deliberately separate from acquisition. It performs one
    # bounded read of the exact asynchronous Cloud Workflow, records the
    # terminal SHADOW result, and then runs the guarded automated promotion
    # controller. It never starts another national build.
    # Serialize it after the handoff so it cannot read the previous day's
    # state while the acquisition job is still recording today's execution.
    # always() keeps recovery reconciliation available when acquisition fails.
    needs:
      - acquire-and-shadow
    if: always() && (github.event_name == 'workflow_dispatch' || vars.ARGENTINA_AUTOMATED_ACQUISITION_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: argentina-production

    env:
      GCP_PROJECT_ID: ${{ vars.VALUEPILOT_GCP_PROJECT_ID }}
      ARCHIVE_BUCKET: ${{ vars.VALUEPILOT_ARGENTINA_ARCHIVE_BUCKET }}
      CONTROL_BUCKET: ${{ vars.VALUEPILOT_ARGENTINA_CONTROL_BUCKET }}
      ACTIVE_BUCKET: ${{ vars.VALUEPILOT_ARGENTINA_ACTIVE_BUCKET }}
      SA_ACTIVE_BUCKET: ${{ vars.VALUEPILOT_ARGENTINA_SA_ACTIVE_BUCKET || 'valuepilot-argentina-runtime-southamerica-east1' }}
      US_BACKEND_URL: ${{ vars.VALUEPILOT_ARGENTINA_US_BACKEND_URL || 'https://valuepilot-argentina-us-east4-m72bv57hrq-uk.a.run.app' }}
      SA_BACKEND_URL: ${{ vars.VALUEPILOT_ARGENTINA_SA_BACKEND_URL || 'https://valuepilot-argentina-sa-east1-m72bv57hrq-rj.a.run.app' }}
      RELEASE_WORKFLOW_NAME: ${{ vars.VALUEPILOT_ARGENTINA_WORKFLOW_NAME }}
      RELEASE_WORKFLOW_LOCATION: ${{ vars.VALUEPILOT_ARGENTINA_WORKFLOW_LOCATION }}
      WIF_PROVIDER: ${{ vars.VALUEPILOT_GCP_WIF_PROVIDER }}
      RELEASE_SERVICE_ACCOUNT: ${{ vars.VALUEPILOT_GCP_RELEASE_SERVICE_ACCOUNT }}

    steps:
      - name: Checkout exact repository revision
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install bounded reconciliation dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Authenticate control-state read with GitHub OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.RELEASE_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          version: '>= 520.0.0'

      - name: Read today's persisted SHADOW state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          argentina_day="$(python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          print(datetime.now(ZoneInfo("America/Argentina/Buenos_Aires")).date().isoformat())
          PY
          )"
          echo "argentina_day=${argentina_day}" >> "${GITHUB_OUTPUT}"
          python -m tools.read_argentina_active_source_identity \
            --active-bucket "${ACTIVE_BUCKET}" --active-project "${GCP_PROJECT_ID}" \
            --output "${RUNNER_TEMP}/valuepilot-reconcile-active.json"
          active_date="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["releaseDate"])' "${RUNNER_TEMP}/valuepilot-reconcile-active.json")"
          python -m tools.argentina_acquisition_schedule_control_v2 read-reconciliation-state \
            --argentina-day "${argentina_day}" \
            --current-release-date "${active_date}" \
            --archive-bucket "${ARCHIVE_BUCKET}" \
            --archive-project "${GCP_PROJECT_ID}" \
            --output "${RUNNER_TEMP}/valuepilot-shadow-state.json"
          status="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["status"])' "${RUNNER_TEMP}/valuepilot-shadow-state.json")"
          workflow_execution="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("workflowExecution") or "")' "${RUNNER_TEMP}/valuepilot-shadow-state.json")"
          state_argentina_day="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("argentinaDate") or "")' "${RUNNER_TEMP}/valuepilot-shadow-state.json")"
          candidate_release="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("candidateReleaseId") or "")' "${RUNNER_TEMP}/valuepilot-shadow-state.json")"
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          echo "active_date=${active_date}" >> "${GITHUB_OUTPUT}"
          echo "workflow_execution=${workflow_execution}" >> "${GITHUB_OUTPUT}"
          echo "state_argentina_day=${state_argentina_day}" >> "${GITHUB_OUTPUT}"
          echo "candidate_release=${candidate_release}" >> "${GITHUB_OUTPUT}"
          superseded="$(python -c 'import json,sys; print(str(json.load(open(sys.argv[1], encoding="utf-8")).get("supersededByActive",False)).lower())' "${RUNNER_TEMP}/valuepilot-shadow-state.json")"
          echo "superseded=${superseded}" >> "${GITHUB_OUTPUT}"
          echo "Persisted SHADOW state: ${status} (${workflow_execution:-none})"

      - name: Fail loudly when the active release approaches the freshness limit
        if: always()
        shell: bash
        env:
          ACTIVE_DATE: ${{ steps.state.outputs.active_date }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from datetime import date, datetime
          from zoneinfo import ZoneInfo

          value = (os.environ.get("ACTIVE_DATE") or "").strip()
          if not value:
              raise SystemExit("::error::Active Argentina release date is unavailable")
          age = (datetime.now(ZoneInfo("America/Argentina/Buenos_Aires")).date() - date.fromisoformat(value)).days
          print(f"Active Argentina release age: {age} day(s); the backend fails closed at 7.")
          if age >= 6:
              raise SystemExit(
                  "::error::Active Argentina release is "
                  f"{age} days old; a refresh must land before the 7-day fail-closed limit."
              )
          PY

      - name: Finish cleanly when no SHADOW is awaiting reconciliation
        if: steps.state.outputs.status != 'SHADOW_STARTED'
        shell: bash
        run: |
          set -euo pipefail
          echo "No asynchronous SHADOW execution is awaiting reconciliation."
          echo "- State: ${{ steps.state.outputs.status }}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Describe the exact asynchronous Cloud Workflow execution
        id: execution
        if: steps.state.outputs.status == 'SHADOW_STARTED'
        shell: bash
        env:
          WORKFLOW_EXECUTION: ${{ steps.state.outputs.workflow_execution }}
        run: |
          set -euo pipefail
          if [[ -z "${WORKFLOW_EXECUTION}" ]]; then
            echo "::error::Persisted SHADOW_STARTED state has no workflow execution identity."
            exit 2
          fi
          gcloud workflows executions describe "${WORKFLOW_EXECUTION}" \
            --workflow "${RELEASE_WORKFLOW_NAME}" \
            --location "${RELEASE_WORKFLOW_LOCATION}" \
            --project "${GCP_PROJECT_ID}" \
            --format=json > "${RUNNER_TEMP}/valuepilot-workflow-execution.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          source = json.loads((temp / "valuepilot-workflow-execution.json").read_text(encoding="utf-8"))
          (temp / "valuepilot-workflow-result.json").write_text(
              json.dumps(source.get("result"), ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          (temp / "valuepilot-workflow-error.json").write_text(
              json.dumps(source.get("error"), ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          print(f"execution state: {source.get('state', 'UNKNOWN')}")
          PY
          execution_state="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("state", ""))' "${RUNNER_TEMP}/valuepilot-workflow-execution.json")"
          echo "execution_state=${execution_state}" >> "${GITHUB_OUTPUT}"

      - name: Reconcile the exact SHADOW result without promotion
        id: reconcile
        if: steps.state.outputs.status == 'SHADOW_STARTED'
        shell: bash
        env:
          ARGENTINA_DAY: ${{ steps.state.outputs.state_argentina_day }}
          WORKFLOW_EXECUTION: ${{ steps.state.outputs.workflow_execution }}
          EXECUTION_STATE: ${{ steps.execution.outputs.execution_state }}
        run: |
          set -euo pipefail
          recorded_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python -m tools.argentina_acquisition_schedule_control_v2 reconcile-shadow-state \
            --argentina-day "${ARGENTINA_DAY}" \
            --workflow-execution "${WORKFLOW_EXECUTION}" \
            --execution-state "${EXECUTION_STATE}" \
            --workflow-result "${RUNNER_TEMP}/valuepilot-workflow-result.json" \
            --workflow-error "${RUNNER_TEMP}/valuepilot-workflow-error.json" \
            --recorded-at "${recorded_at}" \
            --archive-bucket "${ARCHIVE_BUCKET}" \
            --archive-project "${GCP_PROJECT_ID}" \
            --output "${RUNNER_TEMP}/valuepilot-shadow-reconciliation.json"
          status="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["status"])' "${RUNNER_TEMP}/valuepilot-shadow-reconciliation.json")"
          reconciliation="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("reconciliationStatus", "UNKNOWN"))' "${RUNNER_TEMP}/valuepilot-shadow-reconciliation.json")"
          reason="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("reason", ""))' "${RUNNER_TEMP}/valuepilot-shadow-reconciliation.json")"
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          echo "reconciliation=${reconciliation}" >> "${GITHUB_OUTPUT}"
          echo "reason=${reason}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Argentina SHADOW reconciliation"
            echo "- Workflow execution: ${WORKFLOW_EXECUTION}"
            echo "- Cloud Workflow state: ${EXECUTION_STATE}"
            echo "- Durable state: ${status} (${reconciliation})"
            echo "- Reason: ${reason:-none}"
            echo "- Active/canary pointer writes by reconciler: deferred to guarded promotion"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Authenticate US regional smoke checks
        id: smoke-us-auth
        if: inputs.verify_promotion_access == true || (steps.reconcile.outputs.status == 'SHADOW_SUCCEEDED' && steps.state.outputs.superseded != 'true')
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.RELEASE_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ env.US_BACKEND_URL }}
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false

      - name: Authenticate SA regional smoke checks
        id: smoke-sa-auth
        if: inputs.verify_promotion_access == true || (steps.reconcile.outputs.status == 'SHADOW_SUCCEEDED' && steps.state.outputs.superseded != 'true')
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.RELEASE_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ env.SA_BACKEND_URL }}
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false

      - name: Verify current regional promotion access
        if: inputs.verify_promotion_access == true
        shell: bash
        env:
          VALUEPILOT_SMOKE_ID_TOKEN_US: ${{ steps.smoke-us-auth.outputs.id_token }}
          VALUEPILOT_SMOKE_ID_TOKEN_SA: ${{ steps.smoke-sa-auth.outputs.id_token }}
        run: |
          set -euo pipefail
          current_file="${RUNNER_TEMP}/valuepilot-access-current.json"
          gcloud storage cat "gs://${ACTIVE_BUCKET}/control/active.json" > "${current_file}"
          release_id="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["releaseId"])' "${current_file}")"
          python -m tools.verify_argentina_runtime_access \
            --project "${GCP_PROJECT_ID}" --release-id "${release_id}" \
            --backend-url "${US_BACKEND_URL}" --backend-url "${SA_BACKEND_URL}" \
            --token-env VALUEPILOT_SMOKE_ID_TOKEN_US --token-env VALUEPILOT_SMOKE_ID_TOKEN_SA \
            --output "${RUNNER_TEMP}/valuepilot-access-report.json"

      - name: Promote the verified candidate with CAS, smoke checks, and rollback
        if: inputs.verify_promotion_access != true && steps.reconcile.outputs.status == 'SHADOW_SUCCEEDED' && steps.state.outputs.superseded != 'true'
        shell: bash
        env:
          CANDIDATE_RELEASE: ${{ steps.state.outputs.candidate_release }}
          VALUEPILOT_SMOKE_ID_TOKEN_US: ${{ steps.smoke-us-auth.outputs.id_token }}
          VALUEPILOT_SMOKE_ID_TOKEN_SA: ${{ steps.smoke-sa-auth.outputs.id_token }}
        run: |
          set -euo pipefail
          if [[ -z "${CANDIDATE_RELEASE}" ]]; then
            echo "::error::Verified SHADOW state did not carry a candidate release identity."
            exit 2
          fi
          manifest_file="${RUNNER_TEMP}/valuepilot-candidate-manifest.json"
          current_file="${RUNNER_TEMP}/valuepilot-current-pointer.json"
          gcloud storage cat "gs://${ARCHIVE_BUCKET}/releases/${CANDIDATE_RELEASE}/manifest.json" > "${manifest_file}"
          gcloud storage cat "gs://${ACTIVE_BUCKET}/control/active.json" > "${current_file}"
          release_date="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["source"]["releaseDate"])' "${manifest_file}")"
          source_sha="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["source"]["sha256"])' "${manifest_file}")"
          expected_current="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["releaseId"])' "${current_file}")"
          python -m tools.argentina_archived_release_promotion \
            --release-id "${CANDIDATE_RELEASE}" \
            --expected-current-release-id "${expected_current}" \
            --release-date "${release_date}" \
            --source-sha256 "${source_sha}" \
            --archive-bucket "${ARCHIVE_BUCKET}" \
            --us-bucket "${ACTIVE_BUCKET}" \
            --sa-bucket "${SA_ACTIVE_BUCKET}" \
            --project "${GCP_PROJECT_ID}" \
            --smoke-url "${US_BACKEND_URL}" \
            --smoke-url "${SA_BACKEND_URL}" \
            --smoke-token-env VALUEPILOT_SMOKE_ID_TOKEN_US \
            --smoke-token-env VALUEPILOT_SMOKE_ID_TOKEN_SA \
            --service-update "valuepilot-argentina-us-east4:us-east4" \
            --service-update "valuepilot-argentina-sa-east1:southamerica-east1" \
            --control-bucket "${CONTROL_BUCKET}" \
            --output "${RUNNER_TEMP}/valuepilot-promotion.json"
          promotion_status="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["status"])' "${RUNNER_TEMP}/valuepilot-promotion.json")"
          echo "Automated promotion: ${promotion_status} (${CANDIDATE_RELEASE})"
          {
            echo "### Argentina automated promotion"
            echo "- Candidate: ${CANDIDATE_RELEASE}"
            echo "- Status: ${promotion_status}"
            echo "- Regions: us-east4 and southamerica-east1"
            echo "- Activation: CAS pointers followed by authenticated ready/status/search smoke"
            echo "- Rollback: exact prior pointer bytes on failure"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Alert on terminal SHADOW failure
        if: steps.reconcile.outputs.status == 'SHADOW_FAILED'
        shell: bash
        run: |
          echo "::error::Argentina SHADOW execution failed closed: ${{ steps.reconcile.outputs.reason }}"
          exit 1

      - name: Remove runner-local credential material
        if: always()
        shell: bash
        run: |
          set +e
          credential_path="${GOOGLE_GHA_CREDS_PATH:-${GOOGLE_APPLICATION_CREDENTIALS:-}}"
          if [[ -n "${credential_path}" && -f "${credential_path}" ]]; then
            shred -u "${credential_path}" >/dev/null 2>&1 || rm -f "${credential_path}"
          fi
          rm -f gha-creds-*.json
