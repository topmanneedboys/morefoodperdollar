name: Test offline catalog snapshot builder

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/build_offline_catalog_snapshot.py'
      - 'tools/verify_offline_catalog_snapshot.py'
      - 'tools/promote_offline_catalog_snapshot.py'
      - 'tools/promote_offline_catalog_release.py'
      - 'tools/import_open_food_facts_catalog.py'
      - 'tools/select_open_food_facts_launch_catalog.py'
      - 'tools/refresh_offline_catalog_snapshots.py'
      - 'tools/tests/test_build_offline_catalog_snapshot.py'
      - 'tools/tests/test_promote_offline_catalog_snapshot.py'
      - 'tools/tests/test_promote_offline_catalog_release.py'
      - 'tools/tests/test_import_open_food_facts_catalog.py'
      - 'tools/tests/test_select_open_food_facts_launch_catalog.py'
      - 'tools/tests/test_refresh_offline_catalog_snapshots.py'
      - 'tools/tests/test_bundled_offline_catalog_assets.py'
      - '.github/workflows/test-offline-catalog-snapshot.yml'
  pull_request:
    paths:
      - 'tools/build_offline_catalog_snapshot.py'
      - 'tools/verify_offline_catalog_snapshot.py'
      - 'tools/promote_offline_catalog_snapshot.py'
      - 'tools/promote_offline_catalog_release.py'
      - 'tools/import_open_food_facts_catalog.py'
      - 'tools/select_open_food_facts_launch_catalog.py'
      - 'tools/tests/test_build_offline_catalog_snapshot.py'
      - 'tools/tests/test_promote_offline_catalog_snapshot.py'
      - 'tools/tests/test_promote_offline_catalog_release.py'
      - 'tools/refresh_offline_catalog_snapshots.py'
      - 'tools/tests/test_import_open_food_facts_catalog.py'
      - 'tools/tests/test_select_open_food_facts_launch_catalog.py'
      - 'tools/tests/test_bundled_offline_catalog_assets.py'
      - '.github/workflows/test-offline-catalog-snapshot.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compile snapshot builder
        run: >-
          python -m py_compile
          tools/build_offline_catalog_snapshot.py
          tools/verify_offline_catalog_snapshot.py
          tools/promote_offline_catalog_snapshot.py
          tools/promote_offline_catalog_release.py
          tools/import_open_food_facts_catalog.py
          tools/select_open_food_facts_launch_catalog.py
          tools/refresh_offline_catalog_snapshots.py

      - name: Run deterministic snapshot tests
        run: >-
          python -m unittest
          tools.tests.test_build_offline_catalog_snapshot
          tools.tests.test_promote_offline_catalog_snapshot
          tools.tests.test_promote_offline_catalog_release
          tools.tests.test_import_open_food_facts_catalog
          tools.tests.test_select_open_food_facts_launch_catalog
          tools.tests.test_refresh_offline_catalog_snapshots
          tools.tests.test_bundled_offline_catalog_assets
          -v
