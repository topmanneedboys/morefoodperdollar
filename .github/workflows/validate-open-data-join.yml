name: Validate Open Prices and Open Food Facts join

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/analyze-open-prices-off-join.py"
      - ".github/workflows/validate-open-data-join.yml"

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analyzer dependencies
        run: python -m pip install "duckdb>=1.3,<2" "requests>=2.32,<3"

      - name: Download current Open Prices Parquet export
        run: |
          set -euo pipefail
          mkdir -p build/open-data-join
          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-all-errors \
            --user-agent "ValuePilot-OpenData-Validation/1.0" \
            "https://huggingface.co/datasets/openfoodfacts/open-prices/resolve/main/prices.parquet?download=true" \
            --output build/open-data-join/prices.parquet
          test -s build/open-data-join/prices.parquet
          ls -lh build/open-data-join/prices.parquet

      - name: Measure provenance-safe price to quantity join
        run: |
          set -euo pipefail
          python tools/analyze-open-prices-off-join.py \
            --input build/open-data-join/prices.parquet \
            --json build/open-data-join/open-prices-off-join.json \
            --markdown build/open-data-join/open-prices-off-join.md
          cat build/open-data-join/open-prices-off-join.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregate research report
        uses: actions/upload-artifact@v4
        with:
          name: open-prices-off-join
          path: |
            build/open-data-join/open-prices-off-join.json
            build/open-data-join/open-prices-off-join.md
          if-no-files-found: error
          retention-days: 14
