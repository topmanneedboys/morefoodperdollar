name: Build ValuePilot v101 release

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'browser-extension/**'
      - '.github/workflows/build-valuepilot-android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'browser-extension/**'
      - '.github/workflows/build-valuepilot-android.yml'

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: browser-extension/package-lock.json

      - name: Install browser dependencies
        working-directory: browser-extension
        run: npm ci

      - name: Test model, engine, UI, and Firefox package
        working-directory: browser-extension
        env:
          WEB_EXT_NO_UPDATE_NOTIFIER: '1'
        run: npm run check

      - name: Package browser extensions
        run: |
          mkdir -p release
          (cd browser-extension/dist/chromium && zip -X -q -r ../../../release/ValuePilot-v101-chromium.zip .)
          (cd browser-extension/dist/firefox && zip -X -q -r ../../../release/ValuePilot-v101-firefox.zip .)

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 and Build Tools 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.0'

      - name: Test, lint, and build Android APK
        working-directory: android
        run: gradle --no-daemon :shared-core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Summarize JVM test results
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          for (const [label, directory] of [
            ['shared-core', 'android/shared-core/build/test-results/test'],
            ['android-app', 'android/app/build/test-results/testDebugUnitTest'],
          ]) {
            const reports = fs.readdirSync(directory).filter(name => /^TEST-.*\.xml$/.test(name))
            if (reports.length === 0) throw new Error(`No JUnit reports found for ${label}`)
            const totals = { tests: 0, failures: 0, errors: 0, skipped: 0 }
            for (const report of reports) {
              const xml = fs.readFileSync(`${directory}/${report}`, 'utf8')
              const suite = xml.match(/<testsuite\b[^>]*>/)?.[0]
              if (!suite) throw new Error(`No testsuite found in ${report}`)
              for (const key of Object.keys(totals)) {
                totals[key] += Number(suite.match(new RegExp(`\\b${key}="(\\d+)"`))?.[1] ?? 0)
              }
            }
            console.log(`${label}: ${totals.tests} tests, ${totals.failures} failures, ${totals.errors} errors, ${totals.skipped} skipped`)
          }
          NODE

      - name: Verify Android privacy boundary
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          permissions="$($ANDROID_HOME/build-tools/36.0.0/aapt dump permissions android/app/build/outputs/apk/debug/app-debug.apk)"
          for forbidden in android.permission.INTERNET android.permission.ACCESS_NETWORK_STATE; do
            if grep -q "$forbidden" <<<"$permissions"; then
              echo "Unexpected $forbidden permission in APK" >&2
              exit 1
            fi
          done

      - name: Assemble release files and checksums
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk release/ValuePilot-v101.1-android.apk
          (cd release && sha256sum ValuePilot-v101-chromium.zip ValuePilot-v101-firefox.zip ValuePilot-v101.1-android.apk > SHA256SUMS.txt)

      - name: Upload verified release bundle
        uses: actions/upload-artifact@v6
        with:
          name: ValuePilot-v101-release
          path: release/
          if-no-files-found: error
          retention-days: 90
