name: Build ValuePilot v101 release

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'browser-extension/**'
      - 'tools/build_offline_catalog_snapshot.py'
      - 'tools/verify_offline_catalog_snapshot.py'
      - 'tools/promote_offline_catalog_snapshot.py'
      - 'tools/import_open_food_facts_catalog.py'
      - 'tools/select_open_food_facts_launch_catalog.py'
      - 'tools/refresh_offline_catalog_snapshots.py'
      - 'tools/qualify_merchant_feed.py'
      - 'tools/tests/test_build_offline_catalog_snapshot.py'
      - 'tools/tests/test_promote_offline_catalog_snapshot.py'
      - 'tools/tests/test_import_open_food_facts_catalog.py'
      - 'tools/tests/test_select_open_food_facts_launch_catalog.py'
      - 'tools/tests/test_refresh_offline_catalog_snapshots.py'
      - 'tools/tests/test_qualify_merchant_feed.py'
      - 'tools/tests/test_bundled_offline_catalog_assets.py'
      - '.github/workflows/build-valuepilot-android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'browser-extension/**'
      - 'tools/build_offline_catalog_snapshot.py'
      - 'tools/verify_offline_catalog_snapshot.py'
      - 'tools/promote_offline_catalog_snapshot.py'
      - 'tools/import_open_food_facts_catalog.py'
      - 'tools/select_open_food_facts_launch_catalog.py'
      - 'tools/refresh_offline_catalog_snapshots.py'
      - 'tools/qualify_merchant_feed.py'
      - 'tools/tests/test_build_offline_catalog_snapshot.py'
      - 'tools/tests/test_promote_offline_catalog_snapshot.py'
      - 'tools/tests/test_import_open_food_facts_catalog.py'
      - 'tools/tests/test_select_open_food_facts_launch_catalog.py'
      - 'tools/tests/test_refresh_offline_catalog_snapshots.py'
      - 'tools/tests/test_qualify_merchant_feed.py'
      - 'tools/tests/test_bundled_offline_catalog_assets.py'
      - '.github/workflows/build-valuepilot-android.yml'

permissions:
  contents: read
  actions: read

jobs:
  browser-verify:
    if: github.event_name != 'push' || github.ref != 'refs/heads/work/valuepilot-android-milestone'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: browser-extension/package-lock.json

      - name: Install browser dependencies
        working-directory: browser-extension
        run: npm ci

      - name: Test model, engine, UI, and Firefox package
        working-directory: browser-extension
        env:
          WEB_EXT_NO_UPDATE_NOTIFIER: '1'
        run: npm run check

      - name: Package browser extensions
        run: |
          mkdir -p release-browser
          (cd browser-extension/dist/chromium && zip -X -q -r ../../../release-browser/ValuePilot-v101-chromium.zip .)
          (cd browser-extension/dist/firefox && zip -X -q -r ../../../release-browser/ValuePilot-v101-firefox.zip .)

      - name: Upload verified browser parts
        uses: actions/upload-artifact@v6
        with:
          name: ValuePilot-v101-browser-parts
          path: release-browser/
          if-no-files-found: error
          retention-days: 1

  android-verify:
    if: github.event_name != 'push' || github.ref != 'refs/heads/work/valuepilot-android-milestone'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 and Build Tools 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.0'

      - name: Test, lint, and build Android APK
        working-directory: android
        run: gradle --no-daemon :shared-core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Summarize JVM test results
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          for (const [label, directory] of [
            ['shared-core', 'android/shared-core/build/test-results/test'],
            ['android-app', 'android/app/build/test-results/testDebugUnitTest'],
          ]) {
            const reports = fs.readdirSync(directory).filter(name => /^TEST-.*\.xml$/.test(name))
            if (reports.length === 0) throw new Error(`No JUnit reports found for ${label}`)
            const totals = { tests: 0, failures: 0, errors: 0, skipped: 0 }
            for (const report of reports) {
              const xml = fs.readFileSync(`${directory}/${report}`, 'utf8')
              const suite = xml.match(/<testsuite\b[^>]*>/)?.[0]
              if (!suite) throw new Error(`No testsuite found in ${report}`)
              for (const key of Object.keys(totals)) {
                totals[key] += Number(suite.match(new RegExp(`\\b${key}="(\\d+)"`))?.[1] ?? 0)
              }
            }
            console.log(`${label}: ${totals.tests} tests, ${totals.failures} failures, ${totals.errors} errors, ${totals.skipped} skipped`)
          }
          NODE

      - name: Verify Android privacy boundary
        run: |
          set -euo pipefail
          apk='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$apk"
          permissions="$($ANDROID_HOME/build-tools/36.0.0/aapt dump permissions "$apk")"
          for forbidden in android.permission.INTERNET android.permission.ACCESS_NETWORK_STATE; do
            if grep -q "$forbidden" <<<"$permissions"; then
              echo "Unexpected $forbidden permission in APK" >&2
              exit 1
            fi
          done

      - name: Verify APK signature and single signer
        run: |
          set -euo pipefail
          apk='android/app/build/outputs/apk/debug/app-debug.apk'
          signature="$($ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs "$apk")"
          printf '%s\n' "$signature"
          signer_count="$(awk '/^Signer #[0-9]+ certificate DN:/{count++} END{print count+0}' <<<"$signature")"
          if [[ "$signer_count" -ne 1 ]]; then
            echo "Expected exactly one APK signer, found $signer_count" >&2
            exit 1
          fi

      - name: Stage verified Android APK
        run: |
          mkdir -p release-android
          cp android/app/build/outputs/apk/debug/app-debug.apk release-android/ValuePilot-v101.1-android.apk

      - name: Upload verified Android part
        uses: actions/upload-artifact@v6
        with:
          name: ValuePilot-v101-android-part
          path: release-android/
          if-no-files-found: error
          retention-days: 1

  release-bundle:
    if: github.event_name != 'push' || github.ref != 'refs/heads/work/valuepilot-android-milestone'
    needs:
      - browser-verify
      - android-verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download verified browser parts
        uses: actions/download-artifact@v8
        with:
          name: ValuePilot-v101-browser-parts
          path: release

      - name: Download verified Android part
        uses: actions/download-artifact@v8
        with:
          name: ValuePilot-v101-android-part
          path: release

      - name: Verify release inputs and record provenance
        run: |
          set -euo pipefail
          expected_files=(
            'ValuePilot-v101-chromium.zip'
            'ValuePilot-v101-firefox.zip'
            'ValuePilot-v101.1-android.apk'
          )
          for file in "${expected_files[@]}"; do
            test -s "release/$file"
          done
          actual="$(find release -maxdepth 1 -type f -printf '%f\n' | sort)"
          expected="$(printf '%s\n' "${expected_files[@]}" | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "Unexpected release inputs" >&2
            echo "Expected:" >&2
            printf '%s\n' "$expected" >&2
            echo "Actual:" >&2
            printf '%s\n' "$actual" >&2
            exit 1
          fi
          printf '%s\n' "$GITHUB_SHA" > release/COMMIT_SHA.txt

      - name: Assemble checksums
        working-directory: release
        run: |
          set -euo pipefail
          sha256sum \
            ValuePilot-v101-chromium.zip \
            ValuePilot-v101-firefox.zip \
            ValuePilot-v101.1-android.apk \
            COMMIT_SHA.txt \
            > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Upload verified release bundle
        uses: actions/upload-artifact@v6
        with:
          name: ValuePilot-v101-release
          path: release/
          if-no-files-found: error
          retention-days: 90

  milestone-provenance-proof:
    if: github.event_name == 'push' && github.ref == 'refs/heads/work/valuepilot-android-milestone'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Find successful full candidate run for exact SHA
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'

          const token = process.env.GH_TOKEN
          const repository = process.env.GITHUB_REPOSITORY
          const sha = process.env.GITHUB_SHA
          const currentRunId = Number(process.env.GITHUB_RUN_ID)
          const workflowName = 'Build ValuePilot v101 release'
          const workflowPath = '.github/workflows/build-valuepilot-android.yml'
          const requiredJobs = new Set(['browser-verify', 'android-verify', 'release-bundle'])
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'X-GitHub-Api-Version': '2022-11-28',
            'User-Agent': 'valuepilot-milestone-provenance'
          }

          async function get(path) {
            const response = await fetch(`https://api.github.com/repos/${repository}${path}`, { headers })
            if (!response.ok) {
              throw new Error(`GitHub API ${response.status} for ${path}: ${await response.text()}`)
            }
            return response.json()
          }

          const runs = await get(`/actions/runs?head_sha=${encodeURIComponent(sha)}&per_page=100`)
          // Historical ValuePilot candidate branches use work/valuepilot-*.
          // Keep the milestone branch itself ineligible so a direct milestone
          // run can never satisfy its own provenance proof.
          const isCandidateBranch = branch =>
            branch?.startsWith('candidate/') ||
            (branch?.startsWith('work/valuepilot-') &&
              branch !== 'work/valuepilot-android-milestone')
          const candidates = runs.workflow_runs
            .filter(run =>
              run.id !== currentRunId &&
              run.name === workflowName &&
              run.path === workflowPath &&
              run.head_sha === sha &&
              isCandidateBranch(run.head_branch) &&
              run.event === 'push' &&
              run.status === 'completed' &&
              run.conclusion === 'success'
            )
            .sort((left, right) => right.id - left.id)

          let selected = null
          for (const run of candidates) {
            const jobs = await get(`/actions/runs/${run.id}/jobs?per_page=100`)
            const successfulJobs = new Set(
              jobs.jobs
                .filter(job => job.status === 'completed' && job.conclusion === 'success')
                .map(job => job.name)
            )
            if (![...requiredJobs].every(name => successfulJobs.has(name))) continue

            const artifacts = await get(`/actions/runs/${run.id}/artifacts?per_page=100`)
            const release = artifacts.artifacts.find(artifact =>
              artifact.name === 'ValuePilot-v101-release' &&
              artifact.expired === false &&
              artifact.workflow_run?.head_sha === sha
            )
            if (!release) continue

            selected = { run, release }
            break
          }

          if (!selected) {
            throw new Error(`No successful full candidate run with a verified release artifact exists for ${sha}`)
          }

          const output = process.env.GITHUB_OUTPUT
          fs.appendFileSync(output, `run_id=${selected.run.id}\n`)
          fs.appendFileSync(output, `artifact_id=${selected.release.id}\n`)
          fs.appendFileSync(output, `artifact_digest=${selected.release.digest ?? ''}\n`)
          console.log(`Using candidate run ${selected.run.id} from ${selected.run.head_branch}`)
          console.log(`Release artifact ${selected.release.id} digest ${selected.release.digest ?? 'unavailable'}`)
          NODE

      - name: Download exact verified candidate release
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.candidate.outputs.artifact_id }}
          path: verified-candidate
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.candidate.outputs.run_id }}

      - name: Verify candidate bundle and current milestone ref
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_CANDIDATE_RUN_ID: ${{ steps.candidate.outputs.run_id }}
          VERIFIED_ARTIFACT_DIGEST: ${{ steps.candidate.outputs.artifact_digest }}
        run: |
          set -euo pipefail

          expected_files=(
            'COMMIT_SHA.txt'
            'SHA256SUMS.txt'
            'ValuePilot-v101-chromium.zip'
            'ValuePilot-v101-firefox.zip'
            'ValuePilot-v101.1-android.apk'
          )
          actual="$(find verified-candidate -maxdepth 1 -type f -printf '%f\n' | sort)"
          expected="$(printf '%s\n' "${expected_files[@]}" | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "Candidate release bundle has unexpected files" >&2
            echo "Expected:" >&2
            printf '%s\n' "$expected" >&2
            echo "Actual:" >&2
            printf '%s\n' "$actual" >&2
            exit 1
          fi

          recorded_sha="$(tr -d '\r\n' < verified-candidate/COMMIT_SHA.txt)"
          if [[ "$recorded_sha" != "$GITHUB_SHA" ]]; then
            echo "Candidate artifact SHA $recorded_sha does not match promoted SHA $GITHUB_SHA" >&2
            exit 1
          fi

          expected_manifest_files="$(printf '%s\n' \
            'COMMIT_SHA.txt' \
            'ValuePilot-v101-chromium.zip' \
            'ValuePilot-v101-firefox.zip' \
            'ValuePilot-v101.1-android.apk' | sort)"
          actual_manifest_files="$(awk '{print $2}' verified-candidate/SHA256SUMS.txt | sed 's/^\*//' | sort)"
          if [[ "$actual_manifest_files" != "$expected_manifest_files" ]]; then
            echo "Candidate checksum manifest has unexpected entries" >&2
            exit 1
          fi

          (cd verified-candidate && sha256sum -c SHA256SUMS.txt)

          branch_sha="$(node --input-type=module <<'NODE'
          const token = process.env.GH_TOKEN
          const repository = process.env.GITHUB_REPOSITORY
          const branch = encodeURIComponent('work/valuepilot-android-milestone')
          const response = await fetch(`https://api.github.com/repos/${repository}/branches/${branch}`, {
            headers: {
              Accept: 'application/vnd.github+json',
              Authorization: `Bearer ${token}`,
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'valuepilot-milestone-provenance'
            }
          })
          if (!response.ok) throw new Error(`Branch lookup failed: ${response.status} ${await response.text()}`)
          const body = await response.json()
          console.log(body.commit.sha)
          NODE
          )"
          if [[ "$branch_sha" != "$GITHUB_SHA" ]]; then
            echo "Milestone branch moved from $GITHUB_SHA to $branch_sha during verification" >&2
            exit 1
          fi

          {
            echo '### ValuePilot milestone provenance proof'
            echo "- promoted SHA: \`$GITHUB_SHA\`"
            echo "- verified candidate run: \`$VERIFIED_CANDIDATE_RUN_ID\`"
            echo "- candidate artifact digest: \`$VERIFIED_ARTIFACT_DIGEST\`"
            echo '- candidate bundle SHA and internal SHA-256 manifest: verified'
            echo '- milestone ref still points to promoted SHA: verified'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload provenance-verified candidate copy
        uses: actions/upload-artifact@v6
        with:
          name: ValuePilot-v101-provenance-proof
          path: verified-candidate/
          if-no-files-found: error
          retention-days: 90
