name: Validate Open Prices Canada coverage

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/analyze-open-prices.py"
      - ".github/workflows/validate-open-prices.yml"

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analyzer dependency
        run: python -m pip install "duckdb>=1.3,<2"

      - name: Download current Open Prices Parquet export
        run: |
          set -euo pipefail
          mkdir -p build/open-prices
          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-all-errors \
            --user-agent "ValuePilot-OpenPrices-Validation/1.0" \
            "https://huggingface.co/datasets/openfoodfacts/open-prices/resolve/main/prices.parquet?download=true" \
            --output build/open-prices/prices.parquet
          test -s build/open-prices/prices.parquet
          ls -lh build/open-prices/prices.parquet

      - name: Measure Canada and CAD coverage
        run: |
          set -euo pipefail
          python tools/analyze-open-prices.py \
            --input build/open-prices/prices.parquet \
            --json build/open-prices/open-prices-canada-report.json \
            --markdown build/open-prices/open-prices-canada-summary.md
          cat build/open-prices/open-prices-canada-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregate research report
        uses: actions/upload-artifact@v4
        with:
          name: open-prices-canada-coverage
          path: |
            build/open-prices/open-prices-canada-report.json
            build/open-prices/open-prices-canada-summary.md
          if-no-files-found: error
          retention-days: 14
