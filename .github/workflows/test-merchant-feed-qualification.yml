name: Test merchant feed qualification

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/qualify_merchant_feed.py'
      - 'tools/qualify_rakuten_product_catalog.py'
      - 'tools/measure_rakuten_off_quantity_coverage.py'
      - 'tools/run_rakuten_off_quantity_coverage.py'
      - 'tools/tests/test_qualify_*.py'
      - '.github/workflows/test-merchant-feed-qualification.yml'
  pull_request:
    paths:
      - 'tools/qualify_merchant_feed.py'
      - 'tools/qualify_rakuten_product_catalog.py'
      - 'tools/measure_rakuten_off_quantity_coverage.py'
      - 'tools/run_rakuten_off_quantity_coverage.py'
      - 'tools/tests/test_qualify_*.py'
      - '.github/workflows/test-merchant-feed-qualification.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compile qualification harnesses
        run: >-
          python -m py_compile
          tools/qualify_merchant_feed.py
          tools/qualify_rakuten_product_catalog.py
          tools/measure_rakuten_off_quantity_coverage.py
          tools/run_rakuten_off_quantity_coverage.py

      - name: Run qualification harness tests
        run: python -m unittest discover -s tools/tests -p 'test_qualify_*.py' -v
