name: Test merchant feed qualification

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/argentina_national_routing.py'
      - 'tools/build_argentina_national_routing_artifact.py'
      - 'tools/tests/test_argentina_national_routing.py'
      - 'tools/qualify_merchant_feed.py'
      - 'tools/qualify_argentina_sepa.py'
      - 'tools/build_argentina_sepa_regional_snapshot.py'
      - 'tools/verify_argentina_sepa_regional_snapshot.py'
      - 'tools/build_argentina_sepa_national_shards.py'
      - 'tools/verify_argentina_sepa_national_shards.py'
      - 'tools/argentina_sepa_search.py'
      - 'tools/argentina_sepa_mobile_search.py'
      - 'tools/build_argentina_sepa_query_selective_mobile.py'
      - 'tools/verify_argentina_sepa_query_selective_mobile.py'
      - 'tools/argentina_sepa_query.py'
      - 'tools/measure_argentina_sepa_query_selective_mobile.py'
      - 'tools/build_argentina_sepa_micro_partition_mobile.py'
      - 'tools/verify_argentina_sepa_micro_partition_mobile.py'
      - 'tools/argentina_sepa_micro_partition.py'
      - 'tools/measure_argentina_sepa_micro_partition_mobile.py'
      - 'tools/audit_argentina_sepa_search.py'
      - 'tools/shopping_intelligence_engine.py'
      - 'tools/argentina_shopping_intelligence.py'
      - 'tools/measure_argentina_shopping_intelligence.py'
      - 'tools/argentina_daily_release.py'
      - 'tools/build_argentina_daily_release.py'
      - 'tools/argentina_storage_retention.py'
      - 'tools/manage_argentina_storage_retention.py'
      - 'tools/argentina_object_store_publisher.py'
      - 'tools/fixtures/argentina_daily_release/**'
      - 'tools/fixtures/argentina_storage_retention/**'
      - 'tools/tests/test_argentina_daily_release_operations.py'
      - 'tools/tests/test_argentina_storage_retention.py'
      - 'tools/tests/test_argentina_object_store_publisher.py'
      - 'ARGENTINA_PRODUCTION_STORAGE_RETENTION_QUALIFICATION.*'
      - 'tools/qualify_rakuten_product_catalog.py'
      - 'tools/measure_rakuten_off_quantity_coverage.py'
      - 'tools/measure_rakuten_off_quantity_coverage_v2.py'
      - 'tools/open_facts_barcode.py'
      - 'tools/run_rakuten_off_quantity_coverage.py'
      - 'tools/tests/test_qualify_*.py'
      - 'tools/tests/test_argentina_sepa_*.py'
      - 'tools/tests/test_shopping_intelligence_engine.py'
      - 'tools/tests/test_argentina_shopping_intelligence.py'
      - '.github/workflows/test-merchant-feed-qualification.yml'
  pull_request:
    paths:
      - 'tools/argentina_national_routing.py'
      - 'tools/build_argentina_national_routing_artifact.py'
      - 'tools/tests/test_argentina_national_routing.py'
      - 'tools/qualify_merchant_feed.py'
      - 'tools/qualify_argentina_sepa.py'
      - 'tools/build_argentina_sepa_regional_snapshot.py'
      - 'tools/verify_argentina_sepa_regional_snapshot.py'
      - 'tools/build_argentina_sepa_national_shards.py'
      - 'tools/verify_argentina_sepa_national_shards.py'
      - 'tools/argentina_sepa_search.py'
      - 'tools/argentina_sepa_mobile_search.py'
      - 'tools/build_argentina_sepa_query_selective_mobile.py'
      - 'tools/verify_argentina_sepa_query_selective_mobile.py'
      - 'tools/argentina_sepa_query.py'
      - 'tools/measure_argentina_sepa_query_selective_mobile.py'
      - 'tools/build_argentina_sepa_micro_partition_mobile.py'
      - 'tools/verify_argentina_sepa_micro_partition_mobile.py'
      - 'tools/argentina_sepa_micro_partition.py'
      - 'tools/measure_argentina_sepa_micro_partition_mobile.py'
      - 'tools/audit_argentina_sepa_search.py'
      - 'tools/shopping_intelligence_engine.py'
      - 'tools/argentina_shopping_intelligence.py'
      - 'tools/measure_argentina_shopping_intelligence.py'
      - 'tools/argentina_daily_release.py'
      - 'tools/build_argentina_daily_release.py'
      - 'tools/argentina_storage_retention.py'
      - 'tools/manage_argentina_storage_retention.py'
      - 'tools/argentina_object_store_publisher.py'
      - 'tools/fixtures/argentina_daily_release/**'
      - 'tools/fixtures/argentina_storage_retention/**'
      - 'tools/tests/test_argentina_daily_release_operations.py'
      - 'tools/tests/test_argentina_storage_retention.py'
      - 'tools/tests/test_argentina_object_store_publisher.py'
      - 'ARGENTINA_PRODUCTION_STORAGE_RETENTION_QUALIFICATION.*'
      - 'tools/qualify_rakuten_product_catalog.py'
      - 'tools/measure_rakuten_off_quantity_coverage.py'
      - 'tools/measure_rakuten_off_quantity_coverage_v2.py'
      - 'tools/open_facts_barcode.py'
      - 'tools/run_rakuten_off_quantity_coverage.py'
      - 'tools/tests/test_qualify_*.py'
      - 'tools/tests/test_argentina_sepa_*.py'
      - 'tools/tests/test_shopping_intelligence_engine.py'
      - 'tools/tests/test_argentina_shopping_intelligence.py'
      - '.github/workflows/test-merchant-feed-qualification.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compile qualification harnesses
        run: >-
          python -m py_compile
          tools/qualify_merchant_feed.py
          tools/qualify_argentina_sepa.py
          tools/build_argentina_sepa_regional_snapshot.py
          tools/verify_argentina_sepa_regional_snapshot.py
          tools/build_argentina_sepa_national_shards.py
          tools/verify_argentina_sepa_national_shards.py
          tools/argentina_sepa_search.py
          tools/argentina_sepa_mobile_search.py
          tools/build_argentina_sepa_query_selective_mobile.py
          tools/verify_argentina_sepa_query_selective_mobile.py
          tools/argentina_sepa_query.py
          tools/measure_argentina_sepa_query_selective_mobile.py
          tools/build_argentina_sepa_micro_partition_mobile.py
          tools/verify_argentina_sepa_micro_partition_mobile.py
          tools/argentina_sepa_micro_partition.py
          tools/measure_argentina_sepa_micro_partition_mobile.py
          tools/audit_argentina_sepa_search.py
          tools/shopping_intelligence_engine.py
          tools/argentina_shopping_intelligence.py
          tools/measure_argentina_shopping_intelligence.py
          tools/argentina_daily_release.py
          tools/build_argentina_daily_release.py
          tools/argentina_storage_retention.py
          tools/manage_argentina_storage_retention.py
          tools/argentina_object_store_publisher.py
          tools/qualify_rakuten_product_catalog.py
          tools/measure_rakuten_off_quantity_coverage.py
          tools/measure_rakuten_off_quantity_coverage_v2.py
          tools/open_facts_barcode.py
          tools/run_rakuten_off_quantity_coverage.py

      - name: Run offline qualification and regional tests
        run: python -m unittest discover -s tools/tests -p 'test_*.py' -v
