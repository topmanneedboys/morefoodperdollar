name: Test merchant feed qualification

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/qualify_merchant_feed.py'
      - 'tools/tests/test_qualify_merchant_feed.py'
      - '.github/workflows/test-merchant-feed-qualification.yml'
  pull_request:
    paths:
      - 'tools/qualify_merchant_feed.py'
      - 'tools/tests/test_qualify_merchant_feed.py'
      - '.github/workflows/test-merchant-feed-qualification.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compile qualification harness
        run: python -m py_compile tools/qualify_merchant_feed.py

      - name: Run qualification harness tests
        run: python -m unittest discover -s tools/tests -p 'test_qualify_merchant_feed.py' -v
