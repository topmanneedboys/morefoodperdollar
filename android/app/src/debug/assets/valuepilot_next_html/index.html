<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fcf9f2">
  <meta name="description" content="ValuePilot Next — prototipo visual sin conexión con el servicio de precios">
  <title>ValuePilot Next — Prototipo Stitch</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg aria-hidden="true" width="0" height="0" class="svg-sprite" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7.5"/><path d="m16.7 16.7 4.3 4.3"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v10h-7v-6h-4v6H3z"/></symbol>
    <symbol id="i-basket" viewBox="0 0 24 24"><path d="m3 9 3 12h12l3-12H3zM8 9l4-6 4 6M9 13v4m6-4v4"/></symbol>
    <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4V3z"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M3 7h5l2-3h4l2 3h5v13H3z"/><circle cx="12" cy="13" r="4"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h16m-7-7 7 7-7 7"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M20 12H4m7-7-7 7 7 7"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M5 5 19 19M19 5 5 19"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M4 12h16"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="var(--surface)"/><circle cx="16" cy="17" r="3" fill="var(--surface)"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 22s7-6.5 7-13a7 7 0 0 0-14 0c0 6.5 7 13 7 13z"/><circle cx="12" cy="9" r="2.5"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="m12 2 1.6 2.4 3 .1.8 2.7 2.7 1.4-.9 2.8 1.2 2.6-2.3 2-1 2.8-3-.2-2.1 2-2.1-2-3 .2-1-2.8-2.3-2 1.2-2.6-.9-2.8 2.7-1.4.8-2.7 3-.1z"/></symbol>
    <symbol id="i-store" viewBox="0 0 24 24"><path d="M3 9h18L19 4H5L3 9zm1 0v12h16V9M8 21v-8h8v8"/></symbol>
    <symbol id="i-route" viewBox="0 0 24 24"><circle cx="5" cy="5" r="2"/><circle cx="19" cy="19" r="2"/><path d="M7 5h8a4 4 0 0 1 0 8H9a3 3 0 0 0 0 6h8"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12 5 5 11-11"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M19 5l-2 2M7 17l-2 2"/></symbol>
  </svg>
  <div class="viewport-shell">
    <div class="demo-ribbon"><span class="demo-dot"></span><strong>PROTOTIPO INTERACTIVO</strong><span>· Precios y productos ficticios. No son ofertas reales.</span></div>
    <header class="topbar" id="appHeader">
      <button class="brand" type="button" data-nav="home" aria-label="Volver al inicio"><span class="brand-symbol">V<span class="brand-spark">✦</span></span><span class="brand-text"><strong>ValuePilot <span class="next-pill">NEXT</span></strong><small>Buenos Aires (CABA)</small></span></button>
      <div class="header-actions"><button class="icon-button" id="themeToggle" aria-label="Cambiar modo claro/oscuro" title="Tema"><svg><use href="#i-sun"/></svg></button><button class="profile" id="settingsButton" type="button" aria-label="Preferencias">VP</button></div>
    </header>
    <main id="appMain" tabindex="-1" aria-live="off"></main>
    <nav class="bottom-nav" id="bottomNav" aria-label="Navegación principal">
      <button type="button" data-nav="home"><svg><use href="#i-home"/></svg><span>Inicio</span></button>
      <button type="button" data-nav="search"><svg><use href="#i-search"/></svg><span>Buscar</span></button>
      <button type="button" data-nav="basket"><svg><use href="#i-basket"/></svg><span>Canasta</span><i id="basketBubble" class="nav-count" hidden>0</i></button>
      <button type="button" data-nav="saved"><svg><use href="#i-bookmark"/></svg><span>Guardados</span></button>
    </nav>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
